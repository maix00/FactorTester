[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "factortester"
version = "0.1.0"
description = "HTTP command-line client for FactorTester"
requires-python = ">=3.11"
dependencies = ["click>=8"]

[project.scripts]
factortester = "tools.cli.app:cli"

[tool.setuptools]
package-dir = {"" = "../.."}
packages = [
  "tools.cli",
  "tools.cli.commands",
  "tools.cli.core",
  "tools.cli.modules",
  "tools.cli.modules.backtest",
  "tools.cli.modules.custom_factors",
  "tools.cli.modules.products",
  "tools.cli.modules.single_factor_family_test",
]
