[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "factortester"
version = "0.1.0"
description = "HTTP command-line client for FactorTester"
requires-python = ">=3.11"
dependencies = ["click>=8", "plotext>=5.2", "rich>=14"]

[project.scripts]
factortester = "tools.cli.app:cli"

[tool.setuptools]
package-dir = {"" = "../.."}
packages = [
  "tools.cli",
  "tools.cli.commands",
  "tools.cli.core",
  "tools.cli.modules",
  "tools.cli.modules.backtest",
  "tools.cli.modules.backtest.shared",
  "tools.cli.modules.custom_factors",
  "tools.cli.modules.factor_evaluation",
  "tools.cli.modules.factor_type_analysis",
  "tools.cli.modules.ic_test",
  "tools.cli.modules.products",
  "tools.cli.modules.single_factor_family_test",
  "tools.data",
  "tools.data.account_manage",
  "tools.data.artifacts",
  "tools.data.cache",
  "tools.data.factor_workspace",
  "tools.data.modules",
  "tools.data.providers",
  "tools.data.sqlite",
  "tools.data.sqlite.account_manager",
  "tools.data.tech_docs",
  "tools.data.types",
  "tools.data.views",
  "tools.testers",
  "tools.testers._shared",
  "tools.testers.backtest",
  "tools.testers.backtest.engines",
  "tools.testers.backtest.engines.adapters",
  "tools.testers.backtest.engines.adapters.backtrader",
  "tools.testers.backtest.engines.adapters.qlib",
  "tools.testers.backtest.engines.adapters.zipline",
  "tools.testers.backtest.engines.execution",
  "tools.testers.backtest.engines.factors",
  "tools.testers.backtest.engines.market_rules",
  "tools.testers.backtest.engines.native",
  "tools.testers.backtest.engines.observability",
  "tools.testers.backtest.engines.risk",
  "tools.testers.backtest.engines.strategies",
  "tools.testers.backtest.engines.workers",
  "tools.testers.backtest.engines.workers.runners",
  "tools.testers.backtest.modules",
  "tools.testers.factor_evaluation",
  "tools.testers.factor_type_analysis",
  "tools.testers.home",
  "tools.testers.ic_test",
  "tools.testers.settings",
  "tools.testers.single_factor_family_test",
]
