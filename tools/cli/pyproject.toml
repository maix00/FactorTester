[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "factortester"
version = "0.1.2"
description = "HTTP command-line client for FactorTester"
requires-python = ">=3.11"
dependencies = [
  "click>=8",
  "orjson==3.11.9",
  "plotext>=5.2",
  "pyright[nodejs]==1.1.411",
  "rich>=14",
]

[project.scripts]
factortester = "tools.cli.app:cli"

[tool.setuptools]
include-package-data = false
packages = [
  "tools.cli",
  "tools.cli.commands",
  "tools.cli.core",
  "tools.cli.manager",
  "tools.cli.protocols",
  "tools.cli.modules",
  "tools.cli.modules.custom_factors",
  "tools.cli.modules.products",
  "tools.cli.step",
  "tools.cli.release",
  "tools.cli.release.adapters",
  "tools.cli.release.research_reporting",
  "tools.cli.release.research_reporting.authoring",
  "tools.cli.release.research_reporting.maintenance",
  "tools.cli.release.research_reporting.publisher",
]

[tool.setuptools.package-dir]
"tools.cli" = "."
"tools.cli.commands" = "commands"
"tools.cli.core" = "core"
"tools.cli.manager" = "manager"
"tools.cli.protocols" = "protocols"
"tools.cli.modules" = "modules"
"tools.cli.modules.custom_factors" = "modules/custom_factors"
"tools.cli.modules.products" = "modules/products"
"tools.cli.step" = "step"
"tools.cli.release" = "release"
"tools.cli.release.adapters" = "release/adapters"
"tools.cli.release.research_reporting" = "release/research_reporting"
"tools.cli.release.research_reporting.authoring" = "release/research_reporting/authoring"
"tools.cli.release.research_reporting.maintenance" = "release/research_reporting/maintenance"
"tools.cli.release.research_reporting.publisher" = "release/research_reporting/publisher"

[tool.setuptools.package-data]
"tools.cli.release" = [
  "trusted-release-public.pem",
  "trusted-beta-release-public.pem",
]
