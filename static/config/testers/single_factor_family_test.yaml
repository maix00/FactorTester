# 单因子家族测试页面的测试模块唯一注册表。key 必须能在
# tools/testers/settings/applications.py 找到对应的 "<key>_settings" 工厂函数
# （group_test 额外嵌套 BacktestModuleRegistry，见
# single_factor_family_test/registry.py 的 sub_registry 解析）。
# 新增/调整模块只改这一处。
version: 1
modules:
  - key: single_factor_page
    label: 因子家族测试设置
    order: 10
  - key: factor_evaluation
    label: 因子评估
    order: 20
  - key: factor_type_analysis
    label: 因子类型分析
    order: 30
  - key: ic_test
    label: IC 测试
    order: 40
  - key: group_test
    label: 分组回测
    order: 50
    sub_registry: backtest_module_registry
