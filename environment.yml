name: GTHT

# ═══════════════════════════════════════════════════════════════════════
# FactorTester 环境配置文件
# ═══════════════════════════════════════════════════════════════════════
#
# ▶ 跨平台创建/更新环境（一条命令即可）:
#     python scripts/setup_gtht_env.py [--name <unique-environment-name>]
#
#   脚本在 macOS 使用本文件中的 pip NumPy/SciPy（Apple Accelerate），
#   在 Windows 创建后自动切换为 conda-forge MKL NumPy/SciPy。
#
# ▶ BLAS 后端:
#     macOS 使用 pip wheel，链接 Apple Accelerate。
#     defaults channel 的 conda numpy 在 macOS 实际会选择 OpenBLAS，不要
#     把 numpy/scipy 移到下面的 conda dependencies。
#
#     Windows 的 MKL 切换由 setup_gtht_env.py 自动执行。
# ═══════════════════════════════════════════════════════════════════════
dependencies:
  - python=3.14.0
  # 3.51.0/3.51.1 have a Unix open/close deadlock; use the fixed release.
  - sqlite=3.53.2
  - pip=25.2
  - pip:
      - flask==3.1.3
      - duckdb==1.5.3
      - waitress==3.0.2
      - watchdog==6.0.0
      - pandas==3.0.2
      - numpy==2.3.4
      - scipy==1.16.3
      - matplotlib==3.10.7
      - pyarrow==22.0.0
      - openpyxl==3.1.5
      - tqdm==4.67.1
      - pytest==9.0.3
      - rich==15.0.0
      - sqlite-web==0.7.2
      - statsmodels==0.14.6
      - orjson==3.11.9
      - playwright==1.60.0
      - beautifulsoup4==4.15.0
      - html5lib==1.1
      - pyright[nodejs]==1.1.411
      - mypy==2.1.0
      - pyyaml==6.0.2
      - akshare==1.18.64
      - psycopg[binary]>=3.2,<4
      - cryptography>=43,<50
