name: GTHT

# ═══════════════════════════════════════════════════════════════════════
# FactorTester 环境配置文件
# ═══════════════════════════════════════════════════════════════════════
#
# ▶ 创建/更新环境（一条命令即可）:
#     conda env create -f environment.yml       # 首次创建
#     conda env update -f environment.yml       # 已有环境，增量更新
#
# ▶ 为什么 numpy/scipy 放在 conda 依赖而非 pip?
#     pip 版 numpy 在构建时把 BLAS 库写死在 wheel 里:
#       macOS  wheel → Apple Accelerate（好）
#       Windows wheel → OpenBLAS（慢，比 Accelerate 慢 3-5x）
#     pip 装完就无法换 BLAS 后端。
#
#     conda 版 numpy 动态链接 BLAS，solver 按平台自动选:
#       macOS   → Apple Accelerate（系统原生，最优）
#       Windows → Intel MKL（比 pip 版 OpenBLAS 快 2-3x）
#
#     其他包（flask/duckdb/pandas...）没有 BLAS 选择问题，
#     放 pip 没问题。
# ═══════════════════════════════════════════════════════════════════════
dependencies:
  - python=3.14.0
  - sqlite=3.51.0
  - pip=25.2
  - numpy=2.3.4          # conda → 平台自适应 BLAS
  - scipy=1.16.3         # conda → 同上
  - pip:
      - flask==3.1.3
      - duckdb==1.5.3
      - waitress==3.0.2
      - pandas==3.0.2
      - matplotlib==3.10.7
      - pyarrow==22.0.0
      - openpyxl==3.1.5
      - tqdm==4.67.1
      - pytest==9.0.3
      - sqlite-web==0.7.2
      - statsmodels==0.14.6
      - orjson==3.11.9
      - playwright==1.60.0
