<!DOCTYPE html>
<html>
<head>
    <title>登录 — 单因子测试</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: #f4f6f8; }
        .login-card {
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.10);
            padding: 40px 36px 32px;
            width: 360px;
            max-width: 95vw;
        }
        .login-card h2 { margin: 0 0 24px; font-size: 20px; color: #1a1a1a; text-align: center; }
        .login-card label { display: block; font-size: 13px; color: #555; margin-bottom: 4px; }
        .login-card input[type=text], .login-card input[type=password] {
            width: 100%; box-sizing: border-box;
            padding: 9px 12px; border: 1px solid #d0d5dd; border-radius: 6px;
            font-size: 14px; margin-bottom: 16px; outline: none;
            transition: border-color 0.2s;
        }
        .login-card input:focus { border-color: #0078d4; }
        .login-card .btn-primary {
            width: 100%; padding: 10px; background: #0078d4; color: #fff;
            border: none; border-radius: 6px; font-size: 15px; cursor: pointer;
            margin-top: 4px; transition: background 0.2s;
        }
        .login-card .btn-primary:hover { background: #005fa3; }
        .login-card .toggle-link {
            display: block; text-align: center; margin-top: 14px;
            font-size: 13px; color: #0078d4; cursor: pointer;
        }
        .login-card .toggle-link:hover { text-decoration: underline; }
        #login-error { color: #d40000; font-size: 13px; min-height: 18px; margin-bottom: 8px; text-align: center; }
    </style>
</head>
<body>
<div class="login-card">
    <h2 id="login-title">登录</h2>
    <div id="login-error"></div>
    <label for="login-username">用户名</label>
    <input type="text" id="login-username" placeholder="请输入用户名" autocomplete="username">
    <label for="login-password">密码</label>
    <input type="password" id="login-password" placeholder="请输入密码" autocomplete="current-password">
    <button class="btn-primary" id="login-submit">登录</button>
    <span class="toggle-link" id="login-toggle">没有账号？注册</span>
</div>
<script>
    let isRegister = false;
    const titleEl    = document.getElementById('login-title');
    const submitEl   = document.getElementById('login-submit');
    const toggleEl   = document.getElementById('login-toggle');
    const errorEl    = document.getElementById('login-error');
    const usernameEl = document.getElementById('login-username');
    const passwordEl = document.getElementById('login-password');

    toggleEl.addEventListener('click', () => {
        isRegister = !isRegister;
        titleEl.textContent  = isRegister ? '注册' : '登录';
        submitEl.textContent = isRegister ? '注册' : '登录';
        toggleEl.textContent = isRegister ? '已有账号？登录' : '没有账号？注册';
        errorEl.textContent  = '';
    });

    async function doSubmit() {
        const username = usernameEl.value.trim();
        const password = passwordEl.value;
        errorEl.textContent = '';
        if (!username || !password) { errorEl.textContent = '请填写用户名和密码'; return; }
        const url = isRegister ? '/register' : '/login';
        try {
            const res = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            const data = await res.json();
            if (data.success) {
                window.location.href = '/';
            } else {
                errorEl.textContent = data.error || '操作失败';
            }
        } catch (e) {
            errorEl.textContent = '网络错误，请重试';
        }
    }

    submitEl.addEventListener('click', doSubmit);
    passwordEl.addEventListener('keydown', e => { if (e.key === 'Enter') doSubmit(); });
</script>
</body>
</html>
