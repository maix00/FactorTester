<!DOCTYPE html>
<html>
<head>
    <title>用户与机构管理</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { margin: 0; background: #f5f7fb; color: #1f2937; font-family: "Avenir Next", "PingFang SC", sans-serif; }
        .page { max-width: 1180px; margin: 34px auto; padding: 0 24px; }
        .topbar { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; margin-bottom: 22px; }
        .topbar h1 { margin: 0; font-size: 24px; }
        .back { color: #2563eb; text-decoration: none; font-size: 13px; }
        .grid { display: grid; grid-template-columns: 340px 1fr; gap: 18px; align-items: start; }
        .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 14px; box-shadow: 0 8px 28px rgba(15,23,42,.06); padding: 18px; }
        .card h2 { margin: 0 0 14px; font-size: 16px; }
        label { display: block; margin-top: 10px; font-size: 12px; color: #6b7280; }
        input, select { width: 100%; box-sizing: border-box; margin-top: 4px; border: 1px solid #d1d5db; border-radius: 8px; padding: 8px 10px; font-size: 13px; background: #fff; }
        button { border: 0; border-radius: 8px; padding: 8px 12px; cursor: pointer; font-size: 13px; }
        .primary { background: #2563eb; color: #fff; }
        .secondary { background: #eef2ff; color: #3730a3; }
        .status { min-height: 18px; margin-top: 10px; color: #6b7280; font-size: 12px; }
        .role-note { background: #f8fafc; border: 1px solid #e5e7eb; border-radius: 10px; padding: 12px; font-size: 12px; line-height: 1.7; color: #4b5563; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; table-layout: fixed; }
        th, td { border-bottom: 1px solid #eef2f7; padding: 10px 8px; text-align: left; vertical-align: middle; }
        th { color: #6b7280; font-weight: 600; background: #fafafa; }
        th:nth-child(1), td:nth-child(1) { width: 22%; }
        th:nth-child(2), td:nth-child(2) { width: 14%; }
        th:nth-child(3), td:nth-child(3) { width: 16%; }
        th:nth-child(4), td:nth-child(4) { width: 48%; }
        td { overflow: hidden; text-overflow: ellipsis; }
        .pill { display: inline-flex; padding: 2px 8px; border-radius: 999px; background: #f3f4f6; color: #374151; font-size: 12px; }
        .muted { color: #9ca3af; }
        .role-op-cell { display: flex; flex-direction: column; gap: 8px; }
        .row-actions { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; align-items: center; }
        .row-actions > * { min-width: 0; }
        .row-actions select { width: 100%; margin: 0; padding: 6px 8px; }
        .row-actions button { width: 100%; padding: 6px 8px; }
        .org-row td { background: #f8fafc; padding: 0; }
        .org-toggle {
            width: 100%; display: flex; align-items: center; gap: 8px;
            background: transparent; color: #344054; font-weight: 650;
            padding: 10px 8px; text-align: left;
        }
        .org-toggle .caret { color: #98a2b3; font-size: 10px; width: 12px; }
        .org-toggle .count { margin-left: auto; color: #98a2b3; font-weight: 500; font-size: 12px; }
        .org-user-row.collapsed { display: none; }
        .org-row.open .caret { transform: rotate(90deg); }
        .org-admin-row { display:flex; gap:8px; align-items:center; margin-top:10px; }
        .org-admin-row select { flex:1; margin:0; }
        .danger { background:#fee2e2; color:#991b1b; }
        .hier-card { margin-top: 18px; padding: 12px; border: 1px solid #e5e7eb; border-radius: 10px; background: #fcfdff; }
        .hier-toolbar { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:10px; }
        .hier-toolbar input, .hier-toolbar select { margin:0; width:auto; min-width:120px; }
        .hier-toolbar button { padding:6px 10px; font-size:12px; }
        .hier-node { padding: 4px 0 4px 14px; border-left: 1px dashed #d0d5dd; margin-left: 8px; }
        .hier-label { font-size: 12px; color:#334155; display:flex; gap:8px; align-items:center; }
        .hier-role { color:#64748b; font-size:11px; }
        .hier-caret { width: 12px; display:inline-block; color:#94a3b8; cursor:pointer; user-select:none; }
        .hier-children { margin-left: 8px; }
        .hier-node.collapsed > .hier-children { display: none; }
        .hier-actions { display:flex; gap:6px; margin:6px 0 2px 20px; flex-wrap:wrap; }
        .hier-actions button { padding:4px 8px; font-size:11px; border-radius:6px; }
        @media (max-width: 860px) { .grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="page">
        <div class="topbar">
            {% set back_link_class = 'back' %}
            {% include 'modules/shared/home_back_link.html' %}
            <h1>用户与机构管理</h1>
        </div>
        <div class="grid">
            <div class="card">
                <h2>新建用户</h2>
                <label>用户名</label>
                <input id="new-alias" placeholder="例如：研究员A">
                <label>初始密码</label>
                <input id="new-password" type="password" placeholder="至少 6 位">
                <label>角色</label>
                <select id="new-role"></select>
                <label>所属机构</label>
                <select id="new-org"></select>
                <label>上级用户</label>
                <select id="new-parent"></select>
                <button class="primary" style="margin-top:14px;width:100%;" onclick="createUser()">创建用户</button>
                <div class="status" id="user-status"></div>

                <div id="org-create-box" style="display:none;margin-top:22px;">
                    <h2>新建机构</h2>
                    <label>机构名称</label>
                    <input id="new-org-name" placeholder="例如：量化一部">
                    <label>说明</label>
                    <input id="new-org-desc" placeholder="可选">
                    <button class="secondary" style="margin-top:14px;width:100%;" onclick="createOrganization()">创建机构</button>
                    <div class="status" id="org-status"></div>
                    <div class="org-admin-row">
                        <select id="delete-org-id"></select>
                        <button class="danger" onclick="deleteOrganization()">删除机构</button>
                    </div>
                </div>
            </div>

            <div class="card">
                <h2>权限边界</h2>
                <div class="role-note" id="role-note"></div>
                <h2 style="margin-top:18px;">用户列表</h2>
                <table>
                    <thead>
                        <tr>
                            <th>用户</th>
                            <th>机构</th>
                            <th>上级</th>
                            <th>角色/操作</th>
                        </tr>
                    </thead>
                    <tbody id="users-body">
                        <tr><td colspan="4" class="muted">加载中...</td></tr>
                    </tbody>
                </table>
                <div class="hier-card">
                    <h2 style="margin:0 0 8px;">层级树</h2>
                    <div class="hier-toolbar">
                        <input id="hier-org-name" placeholder="新机构名称">
                        <input id="hier-org-desc" placeholder="机构说明（可选）">
                        <button class="secondary" onclick="createOrganizationFromTree()">新增机构</button>
                        <select id="hier-delete-org-id"></select>
                        <button class="danger" onclick="deleteOrganizationFromTree()">删除机构</button>
                        <button class="secondary" onclick="expandAllHierarchy()">全部展开</button>
                        <button class="secondary" onclick="collapseAllHierarchy()">全部收起</button>
                    </div>
                    <div id="hierarchy-tree" class="muted">加载中...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let ctx = null;
        const roleOrder = ['super_admin', 'org_admin', 'level_admin', 'user'];

        async function loadContext() {
            const data = await fetch('/admin/api/context').then(r => r.json());
            if (!data.success) {
                document.body.innerHTML = '<p style="padding:40px;color:#b91c1c;">' + (data.error || '无权访问') + '</p>';
                return;
            }
            ctx = data;
            renderControls();
            renderUsers();
        }

        function allowedRoles() {
            const role = ctx.current_user.role;
            if (role === 'super_admin') return roleOrder;
            if (role === 'org_admin') return ['org_admin', 'level_admin', 'user'];
            if (role === 'level_admin') return ['level_admin', 'user'];
            return ['user'];
        }

        function renderControls() {
            const roles = allowedRoles();
            document.getElementById('new-role').innerHTML = roles.map(r => `<option value="${r}">${ctx.role_labels[r] || r}</option>`).join('');
            document.getElementById('new-org').innerHTML = ctx.organizations.map(o => `<option value="${esc(o.id)}">${esc(o.name)}</option>`).join('');
            document.getElementById('new-parent').innerHTML =
                '<option value="">无上级</option>' + ctx.users.map(u => `<option value="${esc(u.username)}">${esc(u.alias)} (${esc(u.username)})</option>`).join('');
            document.getElementById('org-create-box').style.display = ctx.current_user.role === 'super_admin' ? '' : 'none';
            const deletableOrgs = (ctx.organizations || []).filter(o => o.id !== 'default');
            const deleteOrgSel = document.getElementById('delete-org-id');
            if (deleteOrgSel) {
                deleteOrgSel.innerHTML = '<option value="">选择机构</option>' + deletableOrgs.map(o => `<option value="${esc(o.id)}">${esc(o.name)} (${esc(o.id)})</option>`).join('');
            }
            const treeDeleteOrgSel = document.getElementById('hier-delete-org-id');
            if (treeDeleteOrgSel) {
                treeDeleteOrgSel.innerHTML = '<option value="">树中删除机构</option>' + deletableOrgs.map(o => `<option value="${esc(o.id)}">${esc(o.name)} (${esc(o.id)})</option>`).join('');
            }
            document.getElementById('role-note').innerHTML =
                '超级管理员：管理全部机构与用户，并保留系统级权限。<br>' +
                '机构管理员：管理本机构用户，可设置机构内层级。<br>' +
                '层级管理员：管理自己的直接下级。<br>' +
                '普通用户：不进入管理界面，但可在因子库查看自己与直接下级的因子配置。';
            renderHierarchy();
        }

        function renderUsers() {
            const body = document.getElementById('users-body');
            const rows = [];
            const users = ctx.current_user.role === 'super_admin' ? groupUsersByOrganization(ctx.users) : [{key: '', label: '', users: ctx.users}];
            users.forEach(group => {
                const groupId = 'org-group-' + group.key.replace(/[^a-zA-Z0-9_-]/g, '_');
                if (ctx.current_user.role === 'super_admin') {
                    const isDefaultOpen = group.key === 'default';
                    rows.push(`<tr class="org-row ${isDefaultOpen ? 'open' : ''}" id="${escAttr(groupId)}"><td colspan="4">
                        <button class="org-toggle" onclick="toggleOrgGroup('${escAttr(groupId)}')">
                            <span class="caret">▶</span><span>${esc(group.label)}</span><span class="count">${group.users.length}</span>
                        </button>
                    </td></tr>`);
                }
                group.users.forEach(u => {
                const roleOptions = allowedRoles().map(r => `<option value="${r}" ${u.role === r ? 'selected' : ''}>${ctx.role_labels[r] || r}</option>`).join('');
                const orgOptions = ctx.organizations.map(o => `<option value="${esc(o.id)}" ${u.organization_id === o.id ? 'selected' : ''}>${esc(o.name)}</option>`).join('');
                const parentOptions = '<option value="">无上级</option>' + ctx.users
                    .filter(p => p.username !== u.username)
                    .map(p => `<option value="${esc(p.username)}" ${u.parent_username === p.username ? 'selected' : ''}>${esc(p.alias)}</option>`).join('');
                rows.push(`<tr class="${ctx.current_user.role === 'super_admin' ? 'org-user-row ' + (group.key === 'default' ? '' : 'collapsed ') + escAttr(groupId) : ''}">
                    <td><strong>${esc(u.alias)}</strong><br><span class="muted">${esc(u.username)}</span></td>
                    <td>${esc(u.organization_name || '')}</td>
                    <td>${u.parent_username ? esc(u.parent_username) : '<span class="muted">无</span>'}</td>
                    <td>${u.can_manage ? `<div class="role-op-cell">
                        <span class="pill">${esc(ctx.role_labels[u.role] || u.role)}</span>
                        <div class="row-actions">
                            <select id="role-${escAttr(u.username)}">${roleOptions}</select>
                            <select id="org-${escAttr(u.username)}">${orgOptions}</select>
                            <select id="parent-${escAttr(u.username)}">${parentOptions}</select>
                            <button class="secondary" onclick="updateUser('${escAttr(u.username)}')">保存</button>
                            <button style="background:#fee2e2;color:#991b1b;" onclick="deleteUser('${escAttr(u.username)}', '${escAttr(u.alias)}')">删除</button>
                        </div>
                    </div>` : `<div class="role-op-cell"><span class="pill">${esc(ctx.role_labels[u.role] || u.role)}</span><span class="muted">不可管理</span></div>`}</td>
                </tr>`);
                });
            });
            body.innerHTML = rows.join('');
        }

        function groupUsersByOrganization(users) {
            const groups = {};
            users.forEach(u => {
                const key = u.organization_id || 'unknown';
                if (!groups[key]) {
                    groups[key] = {
                        key,
                        label: (u.organization_name || '未分机构') + ' (' + key + ')',
                        users: [],
                    };
                }
                groups[key].users.push(u);
            });
            return Object.values(groups).sort((a, b) => a.label.localeCompare(b.label));
        }

        function toggleOrgGroup(groupId) {
            const header = document.getElementById(groupId);
            const open = !header.classList.contains('open');
            header.classList.toggle('open', open);
            document.querySelectorAll('.org-user-row.' + groupId).forEach(row => {
                row.classList.toggle('collapsed', !open);
            });
        }

        async function createOrganization() {
            const name = document.getElementById('new-org-name').value.trim();
            const description = document.getElementById('new-org-desc').value.trim();
            const status = document.getElementById('org-status');
            status.textContent = '创建中...';
            const data = await fetch('/admin/api/organizations', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({name, description}),
            }).then(r => r.json());
            status.textContent = data.success ? '已创建机构' : (data.error || '创建失败');
            if (data.success) loadContext();
        }

        async function createOrganizationFromTree() {
            const nameEl = document.getElementById('hier-org-name');
            const descEl = document.getElementById('hier-org-desc');
            document.getElementById('new-org-name').value = (nameEl.value || '').trim();
            document.getElementById('new-org-desc').value = (descEl.value || '').trim();
            await createOrganization();
            nameEl.value = '';
            descEl.value = '';
        }

        async function deleteOrganization() {
            const orgId = (document.getElementById('delete-org-id').value || '').trim();
            const status = document.getElementById('org-status');
            if (!orgId) {
                status.textContent = '请选择要删除的机构';
                return;
            }
            const adminPassword = prompt('请输入超级管理员密码以确认删除机构：');
            if (!adminPassword) return;
            if (!confirm('确定删除机构「' + orgId + '」？机构下仍有用户时将拒绝删除。')) return;
            status.textContent = '删除中...';
            const data = await fetch('/admin/api/organizations/' + encodeURIComponent(orgId), {
                method: 'DELETE',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({admin_password: adminPassword}),
            }).then(r => r.json());
            status.textContent = data.success ? '已删除机构' : (data.error || '删除失败');
            if (data.success) loadContext();
        }

        async function deleteOrganizationFromTree() {
            const src = document.getElementById('hier-delete-org-id');
            const dst = document.getElementById('delete-org-id');
            if (src && dst) dst.value = src.value;
            await deleteOrganization();
        }

        async function createUser() {
            const payload = {
                alias: document.getElementById('new-alias').value.trim(),
                password: document.getElementById('new-password').value,
                role: document.getElementById('new-role').value,
                organization_id: document.getElementById('new-org').value,
                parent_username: document.getElementById('new-parent').value,
            };
            const status = document.getElementById('user-status');
            status.textContent = '创建中...';
            const data = await fetch('/admin/api/users', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload),
            }).then(r => r.json());
            status.textContent = data.success ? '已创建用户' : (data.error || '创建失败');
            if (data.success) {
                document.getElementById('new-password').value = '';
                loadContext();
            }
        }

        async function createUserFromTree(parentUsername, organizationId) {
            const alias = (prompt('请输入新用户名称（别名）：') || '').trim();
            if (!alias) return;
            const password = prompt('请输入初始密码（至少6位）：') || '';
            if (!password || password.length < 6) {
                alert('密码至少6位');
                return;
            }
            const role = prompt('请输入角色（user / level_admin / org_admin）：', 'user') || 'user';
            const payload = {
                alias: alias,
                password: password,
                role: role.trim(),
                organization_id: organizationId || (ctx.current_user.organization_id || 'default'),
                parent_username: parentUsername || '',
            };
            const data = await fetch('/admin/api/users', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload),
            }).then(r => r.json());
            alert(data.success ? '已创建用户' : (data.error || '创建失败'));
            if (data.success) loadContext();
        }

        async function updateUser(username) {
            const data = await fetch('/admin/api/users/' + encodeURIComponent(username), {
                method: 'PUT',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    role: document.getElementById('role-' + username).value,
                    organization_id: document.getElementById('org-' + username).value,
                    parent_username: document.getElementById('parent-' + username).value,
                }),
            }).then(r => r.json());
            alert(data.success ? '已保存' : (data.error || '保存失败'));
            if (data.success) loadContext();
        }

        function _findUser(username) {
            return (ctx.users || []).find(u => u.username === username) || null;
        }

        async function setUserRoleFromTree(username, role) {
            const u = _findUser(username);
            if (!u) return;
            const data = await fetch('/admin/api/users/' + encodeURIComponent(username), {
                method: 'PUT',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    role: role,
                    organization_id: u.organization_id || '',
                    parent_username: u.parent_username || '',
                }),
            }).then(r => r.json());
            alert(data.success ? '角色已更新' : (data.error || '更新失败'));
            if (data.success) loadContext();
        }

        async function deleteUser(username, alias) {
            if (!confirm('确定删除用户「' + alias + '」？账号会被移除，用户目录会自动归档。')) return;
            const data = await fetch('/admin/api/users/' + encodeURIComponent(username), {
                method: 'DELETE',
            }).then(r => r.json());
            alert(data.success ? '已删除用户' : (data.error || '删除失败'));
            if (data.success) loadContext();
        }

        function deleteUserFromTree(username, alias) {
            deleteUser(username, alias);
        }

        function renderHierarchy() {
            const el = document.getElementById('hierarchy-tree');
            if (!el) return;
            const trees = ctx.hierarchy || [];
            if (!trees.length) {
                el.innerHTML = '<span class="muted">暂无层级数据</span>';
                return;
            }
            function roleLabel(role) { return esc((ctx.role_labels && ctx.role_labels[role]) || role || ''); }
            function renderNode(node) {
                const children = Array.isArray(node.children) ? node.children : [];
                const hasChildren = children.length > 0;
                const userObj = _findUser(node.username);
                const canManage = !!(userObj && userObj.can_manage);
                let html = '<div class="hier-node' + (hasChildren ? '' : ' leaf') + '"><div class="hier-label">' +
                    '<span class="hier-caret" onclick="toggleHierarchyNode(this)">' + (hasChildren ? '▼' : '') + '</span>' +
                    '<strong>' + esc(node.alias || node.username || '') + '</strong><span class="hier-role">' + roleLabel(node.role) + '</span><span class="muted">' + esc(node.organization_name || node.organization_id || '') + '</span></div>';
                if (canManage) {
                    html += '<div class="hier-actions">' +
                        '<button class="secondary" onclick="createUserFromTree(\'' + escAttr(node.username) + '\', \'' + escAttr(node.organization_id || '') + '\')">新增下级</button>' +
                        '<button class="secondary" onclick="setUserRoleFromTree(\'' + escAttr(node.username) + '\', \'org_admin\')">设机构管理员</button>' +
                        '<button class="secondary" onclick="setUserRoleFromTree(\'' + escAttr(node.username) + '\', \'level_admin\')">设层级管理员</button>' +
                        '<button class="secondary" onclick="setUserRoleFromTree(\'' + escAttr(node.username) + '\', \'user\')">设普通用户</button>' +
                        '<button class="danger" onclick="deleteUserFromTree(\'' + escAttr(node.username) + '\', \'' + escAttr(node.alias || node.username || '') + '\')">删除节点</button>' +
                        '</div>';
                }
                if (hasChildren) {
                    html += '<div class="hier-children">';
                    children.forEach(child => { html += renderNode(child); });
                    html += '</div>';
                }
                html += '</div>';
                return html;
            }
            let html = '';
            trees.forEach(root => { html += renderNode(root); });
            el.innerHTML = html;
        }

        function toggleHierarchyNode(caretEl) {
            const node = caretEl.closest('.hier-node');
            if (!node || node.classList.contains('leaf')) return;
            const collapsed = node.classList.toggle('collapsed');
            caretEl.textContent = collapsed ? '▶' : '▼';
        }

        function expandAllHierarchy() {
            document.querySelectorAll('#hierarchy-tree .hier-node.collapsed').forEach(node => {
                node.classList.remove('collapsed');
            });
            document.querySelectorAll('#hierarchy-tree .hier-caret').forEach(caret => {
                if (caret.textContent && caret.textContent.trim()) caret.textContent = '▼';
            });
        }

        function collapseAllHierarchy() {
            document.querySelectorAll('#hierarchy-tree .hier-node').forEach(node => {
                if (!node.classList.contains('leaf')) node.classList.add('collapsed');
            });
            document.querySelectorAll('#hierarchy-tree .hier-caret').forEach(caret => {
                if (caret.textContent && caret.textContent.trim()) caret.textContent = '▶';
            });
        }

        function esc(s) {
            const d = document.createElement('div');
            d.textContent = s || '';
            return d.innerHTML;
        }
        function escAttr(s) { return String(s || '').replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }
        loadContext();
    </script>
</body>
</html>
