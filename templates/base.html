<!DOCTYPE html>
<html>
<head>
    <title>单因子测试</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/modules/shared/param_drawer.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/modules/shared/param_info_table.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/modules/shared/collapsible_factor_list.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    {% include 'modules/shared/mathjax_setup.html' %}
    <script src="{{ url_for('static', filename='js/modules/shared/param_drawer_utils.js') }}"></script>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <div id="user-badge" style="position:fixed;top:10px;right:16px;z-index:1000;align-items:center;gap:8px;font-size:13px;color:#444;">
        <span id="user-badge-name" style="background:#f0f4f8;border:1px solid #d0d5dd;border-radius:14px;padding:3px 12px;"></span>
        <button id="user-logout-btn" onclick="doLogout()" style="padding:3px 10px;border:1px solid #d0d5dd;border-radius:14px;background:#fff;cursor:pointer;font-size:13px;color:#555;">退出</button>
    </div>
    <div class="container">
        <div class="sidebar">
            <div style="margin-bottom:12px;">
                {% include 'modules/shared/home_back_link.html' %}
            </div>
            <h2>单因子(家族)测试</h2>
            <input type="text" id="search" placeholder="搜索因子名称..." value="{{ search_query }}" autocomplete="off">
            <label style="display:flex;align-items:center;gap:6px;margin:8px 0 10px;font-size:12px;color:#667085;cursor:pointer;">
                <input type="checkbox" id="include-subordinates" {% if include_subordinates %}checked{% endif %} style="width:auto;margin:0;">
                搜索/查看下级用户因子
            </label>
            <div id="factor-groups">
                {{ group_html | safe }}
            </div>
        </div>
        <div class="main">
            {% if main_content %}
                {{ main_content | safe }}
            {% else %}
                <div style="text-align:center; color:#888; margin-top:100px;">
                    请从左侧选择一个因子
                </div>
            {% endif %}
        </div>
    </div>
    
    <script src="{{ url_for('static', filename='js/base.js') }}"></script>
    <script src="{{ url_for('static', filename='js/modules/shared/collapsible_factor_list.js') }}"></script>
    <script>
        (async function() {
            try {
                const r = await fetch('/api/me');
                const d = await r.json();
                if (d.username) {
                    document.getElementById('user-badge-name').textContent = d.username;
                }
            } catch(e) {}
        })();
        async function doLogout() {
            await fetch('/logout', { method: 'POST' });
            window.location.href = '/login';
        }
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
