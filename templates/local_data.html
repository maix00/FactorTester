<!DOCTYPE html>
<html>
<head>
    <title>本地 SQL 数据</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        body { background: #f6f8fa; color: #1f2937; }
        .data-shell { max-width: 1280px; margin: 32px auto; padding: 0 24px; }
        .data-header { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 18px; }
        .data-title h1 { font-size: 22px; margin: 0 0 4px; color: #111827; }
        .data-title p { margin: 0; font-size: 13px; color: #667085; }
        .data-layout { display: grid; grid-template-columns: 320px minmax(0, 1fr); gap: 18px; align-items: start; }
        .table-list, .table-panel { background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; }
        .table-list { padding: 12px; }
        .table-list h2, .table-panel h2 { font-size: 14px; margin: 0; color: #111827; }
        .table-list-head, .table-panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 14px; border-bottom: 1px solid #e5e7eb; }
        .table-list-head { padding: 4px 4px 10px; }
        .store-button, .table-button { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 8px; margin: 4px 0; background: transparent; border: 1px solid transparent; border-radius: 6px; color: #374151; font-size: 13px; text-align: left; }
        .store-button { font-weight: 600; }
        .store-button:hover,
        .table-button:hover { background: #f3f4f6; border-color: #e5e7eb; }
        .store-button.active,
        .table-button.active { background: #eef4fb; border-color: #b6d4f2; color: #0f4f88; }
        .store-section { border-bottom: 1px solid #eef2f7; margin-bottom: 10px; padding-bottom: 10px; }
        .store-section:last-child { border-bottom: 0; margin-bottom: 0; padding-bottom: 0; }
        .table-button { padding-left: 18px; font-weight: 400; }
        .row-count { color: #667085; font-size: 12px; white-space: nowrap; }
        .table-panel { overflow: hidden; }
        .table-meta { font-size: 12px; color: #667085; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .toolbar { display: flex; align-items: center; gap: 8px; }
        .toolbar button { padding: 5px 10px; font-size: 12px; border-radius: 5px; }
        .table-list-head button.secondary,
        .toolbar button.secondary { background: #fff; border: 1px solid #d0d5dd; color: #344054; }
        .table-list-head button.secondary:hover,
        .toolbar button.secondary:hover { background: #f3f4f6; }
        .data-table-wrap { overflow: auto; max-height: calc(100vh - 190px); }
        .data-table { min-width: 980px; font-size: 12px; }
        .data-table th { position: sticky; top: 0; background: #f8fafc; z-index: 1; color: #344054; }
        .data-table td, .data-table th { white-space: nowrap; max-width: 260px; overflow: hidden; text-overflow: ellipsis; }
        .empty-state { padding: 48px 24px; text-align: center; color: #667085; font-size: 14px; }
        .home-link { font-size: 13px; color: #4a90d9; text-decoration: none; }
        .home-link:hover { text-decoration: underline; }
        @media (max-width: 860px) {
            .data-layout { grid-template-columns: 1fr; }
            .data-header { align-items: flex-start; flex-direction: column; }
        }
    </style>
</head>
<body>
    <div class="data-shell">
        <div class="data-header">
            <div class="data-title">
                <h1>本地 SQL 数据</h1>
                <p>查看 DATA_DIR 下由项目统一管理的只读 SQLite 数据</p>
            </div>
            {% if request.args.get('presentation') != 'embedded' %}
            <a class="home-link" href="/">返回首页</a>
            {% endif %}
        </div>

        <div class="data-layout">
            <aside class="table-list">
                <div class="table-list-head">
                    <h2>Stores / Tables</h2>
                    <button type="button" class="secondary" onclick="loadStores()">刷新</button>
                </div>
                <div id="table-list-body"></div>
            </aside>
            <main class="table-panel">
                <div class="table-panel-head">
                    <div style="min-width:0;">
                        <h2 id="current-table">未选择表</h2>
                        <div class="table-meta" id="table-meta"></div>
                    </div>
                    <div class="toolbar">
                        <button type="button" class="secondary" onclick="page(-1)">上一页</button>
                        <button type="button" class="secondary" onclick="page(1)">下一页</button>
                    </div>
                </div>
                <div id="table-content" class="empty-state">选择左侧表查看内容</div>
            </main>
        </div>
    </div>

    <script>
        let stores = [];
        let activeStore = null;
        let activeTable = null;
        let activeOffset = 0;
        const limit = 200;

        function esc(value) {
            if (value === null || value === undefined) return '';
            return String(value).replace(/[&<>"']/g, s => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[s]));
        }

        async function loadStores() {
            const body = document.getElementById('table-list-body');
            body.innerHTML = '<div class="empty-state" style="padding:20px 8px;">加载中</div>';
            const data = await fetch('/api/local-data/stores').then(r => r.json());
            if (!data.success) {
                body.innerHTML = '<div class="empty-state" style="padding:20px 8px;">加载失败</div>';
                return;
            }
            stores = data.stores || [];
            if (!stores.length) {
                body.innerHTML = '<div class="empty-state" style="padding:20px 8px;">暂无数据源</div>';
                return;
            }
            if (!activeStore) activeStore = stores[0].key;
            await loadTables(activeStore);
        }

        async function loadTables(storeKey) {
            activeStore = storeKey;
            const body = document.getElementById('table-list-body');
            const tableData = await fetch(`/api/local-data/${encodeURIComponent(storeKey)}/tables`).then(r => r.json());
            if (!tableData.success) {
                body.innerHTML = '<div class="empty-state" style="padding:20px 8px;">加载失败</div>';
                return;
            }
            const storeHtml = stores.map(store => `
                <button type="button" class="store-button ${store.key === activeStore ? 'active' : ''}" onclick="selectStore('${esc(store.key)}')">
                    <span>${esc(store.label || store.key)}</span>
                    <span class="row-count">${esc(store.tables)} tables</span>
                </button>
            `).join('');
            const activeTables = tableData.tables || [];
            if (!activeTables.length) {
                body.innerHTML = `<div class="store-section">${storeHtml}</div><div class="empty-state" style="padding:20px 8px;">暂无表</div>`;
                return;
            }
            body.innerHTML = `<div class="store-section">${storeHtml}</div>` + activeTables.map(t => `
                <button type="button" class="table-button ${t.name === activeTable ? 'active' : ''}" onclick="selectTable('${esc(t.name)}')">
                    <span>${esc(t.name)}</span>
                    <span class="row-count">${esc(t.rows)}</span>
                </button>
            `).join('');
            if (!activeTable && activeTables.length) selectTable(activeTables[0].name);
        }

        async function selectStore(storeKey) {
            activeStore = storeKey;
            activeTable = null;
            activeOffset = 0;
            await loadTables(storeKey);
        }

        async function selectTable(name) {
            activeTable = name;
            activeOffset = 0;
            await loadTable();
            loadTables(activeStore);
        }

        async function loadTable() {
            if (!activeTable) return;
            document.getElementById('current-table').textContent = activeTable;
            document.getElementById('table-content').className = 'empty-state';
            document.getElementById('table-content').textContent = '加载中';
            const url = `/api/local-data/${encodeURIComponent(activeStore)}/table/${encodeURIComponent(activeTable)}?limit=${limit}&offset=${activeOffset}`;
            const data = await fetch(url).then(r => r.json());
            if (!data.success) {
                document.getElementById('table-content').textContent = data.error || '加载失败';
                return;
            }
            document.getElementById('table-meta').textContent =
                `${data.store_label || data.store} · ${data.database} · ${data.total} rows · offset ${data.offset}`;
            const columns = data.columns || [];
            const rows = data.rows || [];
            if (!rows.length) {
                document.getElementById('table-content').textContent = '没有数据';
                return;
            }
            const html = `
                <div class="data-table-wrap">
                    <table class="data-table">
                        <thead><tr>${columns.map(c => `<th>${esc(c)}</th>`).join('')}</tr></thead>
                        <tbody>
                            ${rows.map(row => `<tr>${columns.map(c => `<td title="${esc(row[c])}">${esc(row[c])}</td>`).join('')}</tr>`).join('')}
                        </tbody>
                    </table>
                </div>`;
            const content = document.getElementById('table-content');
            content.className = '';
            content.innerHTML = html;
        }

        function page(delta) {
            if (!activeTable) return;
            activeOffset = Math.max(0, activeOffset + delta * limit);
            loadTable();
        }

        loadStores();
    </script>
</body>
</html>
