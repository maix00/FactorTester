<!DOCTYPE html>
<html>
<head>
    <title>工具箱</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .home-wrapper { max-width: 960px; margin: 60px auto; padding: 0 24px; }
        .home-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 40px; }
        .home-header h1 { font-size: 26px; color: #1a1a1a; margin: 0; }
        .user-area { display: flex; align-items: center; gap: 10px; font-size: 13px; color: #555; }
        .user-area .username-badge { background: #f0f4f8; border: 1px solid #d0d5dd; border-radius: 14px; padding: 3px 12px; }
        .user-area button { padding: 4px 14px; border: 1px solid #d0d5dd; border-radius: 14px; background: #fff; cursor: pointer; font-size: 13px; color: #555; }
        .user-area button:hover { background: #f0f4f8; }
        .user-area .btn-login { border-color: #4a90d9; color: #4a90d9; font-weight: 600; }
        .module-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
        .module-card {
            background: #fff; border: 1px solid #e2e8f0; border-radius: 10px;
            padding: 28px 24px 22px; box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            cursor: pointer; color: inherit; display: flex; flex-direction: column; gap: 10px;
            transition: box-shadow 0.15s, border-color 0.15s, transform 0.1s;
        }
        .module-card:hover { box-shadow: 0 6px 20px rgba(0,0,0,0.10); border-color: #4a90d9; transform: translateY(-2px); }
        .module-card .card-icon { font-size: 32px; line-height: 1; }
        .module-card .card-title { font-size: 16px; font-weight: 600; color: #1a1a1a; }
        .module-card .card-desc { font-size: 13px; color: #888; line-height: 1.5; }
        .module-card.coming-soon { opacity: 0.5; cursor: not-allowed; }
        .shutdown-btn-topright { position: fixed; top: 10px; right: 16px; z-index: 100; }

        /* 登录弹窗 */
        #login-overlay {
            display: none; position: fixed; inset: 0;
            background: rgba(0,0,0,0.45); z-index: 9000;
            align-items: center; justify-content: center;
        }
        #login-overlay.visible { display: flex; }
        #login-card {
            background: #fff; border-radius: 12px; box-shadow: 0 8px 40px rgba(0,0,0,0.18);
            padding: 40px 36px 32px; width: 360px; max-width: 94vw; position: relative;
        }
        #login-card h2 { margin: 0 0 20px; font-size: 20px; color: #1a1a1a; text-align: center; }
        #login-card label { display: block; font-size: 13px; color: #555; margin-bottom: 4px; margin-top: 14px; }
        #login-card input[type=text], #login-card input[type=password] {
            width: 100%; padding: 9px 12px; border: 1px solid #d0d5dd; border-radius: 6px; font-size: 14px; box-sizing: border-box;
        }
        #login-card input:focus { outline: none; border-color: #4a90d9; }
        .form-error { color: #d40000; font-size: 13px; min-height: 18px; margin: 10px 0 0; text-align: center; }
        .form-submit { width: 100%; margin-top: 20px; padding: 10px; background: #4a90d9; color: #fff; border: none; border-radius: 6px; font-size: 15px; cursor: pointer; font-weight: 600; }
        .form-submit:hover { background: #357abd; }
        #login-close { position: absolute; top: 12px; right: 16px; background: none; border: none; font-size: 20px; color: #aaa; cursor: pointer; }
        #login-close:hover { color: #555; }
        .login-tabs { display: flex; margin-bottom: 20px; border-bottom: 2px solid #e2e8f0; }
        .login-tab { flex: 1; text-align: center; padding: 8px 0; cursor: pointer; font-size: 14px; color: #888; border-bottom: 2px solid transparent; margin-bottom: -2px; }
        .login-tab.active { color: #4a90d9; border-bottom-color: #4a90d9; font-weight: 600; }
    </style>
</head>
<body>
    <button id="shutdown-btn" class="shutdown-btn-topright" onclick="shutdownServer()" style="display:none">关闭服务器</button>

    <div class="home-wrapper">
        <div class="home-header">
            <h1>工具箱</h1>
            <div class="user-area" id="user-area"></div>
        </div>
        <div class="module-grid">
            <div class="module-card" onclick="goModule('/single_factor_test')">
                <div class="card-icon">📊</div>
                <div class="card-title">单因子测试</div>
                <div class="card-desc">IC 分析、分组回测、因子有效性评估</div>
            </div>
            <div class="module-card" onclick="goModule('/multi_factor_test')">
                <div class="card-icon">🔗</div>
                <div class="card-title">多因子测试</div>
                <div class="card-desc">多因子合成与组合回测</div>
            </div>
            <div class="module-card" onclick="goModule('/price_viewer')">
                <div class="card-icon">📈</div>
                <div class="card-title">序列查看</div>
                <div class="card-desc">查看产品历史价格、成交量、持仓量走势</div>
            </div>
            <div class="module-card" onclick="goModule('/custom-factors/editor')">
                <div class="card-icon">🧬</div>
                <div class="card-title">因子管理</div>
                <div class="card-desc">创建、编辑和管理自定义因子表达式</div>
            </div>
            <div class="module-card" id="admin-users-card" onclick="goModule('/admin/users')" style="display:none">
                <div class="card-icon">🏛</div>
                <div class="card-title">用户与机构管理</div>
                <div class="card-desc">管理机构、用户层级与管理员权限</div>
            </div>
            <div class="module-card" onclick="goModule('/docs')">
                <div class="card-icon">📖</div>
                <div class="card-title">技术文档</div>
                <div class="card-desc">前后端架构、API 接口、因子说明</div>
            </div>
        </div>
    </div>

    <!-- 登录/注册弹窗 -->
    <div id="login-overlay">
        <div id="login-card">
            <button id="login-close" onclick="closeLoginModal()">✕</button>
            <h2>欢迎使用</h2>
            <div class="login-tabs">
                <div class="login-tab active" id="tab-login"    onclick="switchTab('login')">登录</div>
                <div class="login-tab"        id="tab-register" onclick="switchTab('register')">注册</div>
            </div>
            <div id="form-login">
                <label>用户名</label>
                <input type="text"     id="login-username" placeholder="输入用户名" autocomplete="username">
                <label>密码</label>
                <input type="password" id="login-password" placeholder="输入密码" autocomplete="current-password"
                       onkeydown="if(event.key==='Enter') doLogin()">
                <div class="form-error" id="login-error"></div>
                <button class="form-submit" onclick="doLogin()">登录</button>
            </div>
            <div id="form-register" style="display:none">
                <label>用户名</label>
                <input type="text"     id="reg-username" placeholder="输入用户名" autocomplete="username">
                <label>所属机构</label>
                <select id="reg-organization" style="width:100%; padding:9px 12px; border:1px solid #d0d5dd; border-radius:6px; font-size:14px; box-sizing:border-box;"></select>
                <label>密码（至少6位）</label>
                <input type="password" id="reg-password" placeholder="输入密码" autocomplete="new-password"
                       onkeydown="if(event.key==='Enter') doRegister()">
                <div class="form-error" id="reg-error"></div>
                <button class="form-submit" onclick="doRegister()">注册</button>
            </div>
        </div>
    </div>

    <script>
        let _currentUser = null;
        let _isAdmin     = false;
        let _currentRole  = null;
        let _pendingUrl  = null;
        let _organizations = [];

        async function init() {
            const data = await fetch('/api/me').then(r => r.json());
            await loadOrganizations();
            _currentUser = data.username || null;
            _isAdmin     = data.is_admin || false;
            _currentRole  = data.role || null;
            renderUserArea();
            document.getElementById('shutdown-btn').style.display = _isAdmin ? '' : 'none';
            const next = new URLSearchParams(location.search).get('next');
            if (next && !_currentUser) openLoginModal(next);
        }

        function renderUserArea() {
            const area = document.getElementById('user-area');
            const adminCard = document.getElementById('admin-users-card');
            const canManageUsers = ['super_admin', 'org_admin', 'level_admin'].includes(_currentRole);
            if (adminCard) adminCard.style.display = canManageUsers ? '' : 'none';
            if (_currentUser) {
                area.innerHTML = '<span class="username-badge">' + _currentUser + '</span>'
                    + '<label style="display:inline-flex;align-items:center;gap:4px;font-size:13px;color:#555;cursor:pointer;margin-left:4px;"><input type="checkbox" id="keep-login-cb" onchange="setKeepLogin(this.checked)" style="width:auto;margin:0;">保持登录</label>'
                    + '<button onclick="doLogout()">退出登录</button>';
                // 从服务端获取当前 keep_login 状态
                fetch('/api/me').then(r=>r.json()).then(d => {
                    document.getElementById('keep-login-cb').checked = !!d.keep_login;
                });
            } else {
                area.innerHTML = '<button class="btn-login" onclick="openLoginModal(null)">登录 / 注册</button>';
            }
        }

        function goModule(url) {
            if (_currentUser) { location.href = url; }
            else { openLoginModal(url); }
        }

        function openLoginModal(nextUrl) {
            _pendingUrl = nextUrl;
            document.getElementById('login-overlay').classList.add('visible');
            switchTab('login');
            setTimeout(() => document.getElementById('login-username').focus(), 50);
        }

        function closeLoginModal() {
            document.getElementById('login-overlay').classList.remove('visible');
            _pendingUrl = null;
        }

        document.getElementById('login-overlay').addEventListener('click', function(e) {
            if (e.target === this) closeLoginModal();
        });

        function switchTab(tab) {
            document.getElementById('form-login').style.display    = tab === 'login'    ? '' : 'none';
            document.getElementById('form-register').style.display = tab === 'register' ? '' : 'none';
            document.getElementById('tab-login').classList.toggle('active',    tab === 'login');
            document.getElementById('tab-register').classList.toggle('active', tab === 'register');
            document.getElementById('login-error').textContent = '';
            document.getElementById('reg-error').textContent   = '';
        }

        async function doLogin() {
            const username = document.getElementById('login-username').value.trim();
            const password = document.getElementById('login-password').value;
            document.getElementById('login-error').textContent = '';
            const res  = await fetch('/login', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username, password}),
            });
            const data = await res.json();
            if (data.success) {
                _currentUser = data.username;
                _isAdmin     = data.is_admin || false;
                _currentRole  = data.role || null;
                renderUserArea();
                const nextUrl = _pendingUrl;
                closeLoginModal();
                document.getElementById('shutdown-btn').style.display = _isAdmin ? '' : 'none';
                if (nextUrl) location.href = nextUrl;
            } else {
                document.getElementById('login-error').textContent = data.error || '登录失败';
            }
        }

        async function doRegister() {
            const username = document.getElementById('reg-username').value.trim();
            const password = document.getElementById('reg-password').value;
            const organization_id = document.getElementById('reg-organization').value;
            document.getElementById('reg-error').textContent = '';
            const res  = await fetch('/register', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username, password, organization_id}),
            });
            const data = await res.json();
            if (data.success) {
                _currentUser = data.username;
                _isAdmin     = data.is_admin || false;
                _currentRole  = data.role || null;
                renderUserArea();
                const nextUrl = _pendingUrl;
                closeLoginModal();
                document.getElementById('shutdown-btn').style.display = _isAdmin ? '' : 'none';
                if (nextUrl) location.href = nextUrl;
            } else {
                document.getElementById('reg-error').textContent = data.error || '注册失败';
            }
        }

        async function doLogout() {
            await fetch('/logout', {method: 'POST'});
            _currentUser = null;
            _currentRole = null;
            renderUserArea();
        }

        async function setKeepLogin(val) {
            await fetch('/api/keep_login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({keep_login: val}),
            });
        }

        async function loadOrganizations() {
            const data = await fetch('/api/organizations').then(r => r.json()).catch(() => ({success:false}));
            _organizations = data.success ? (data.organizations || []) : [];
            const select = document.getElementById('reg-organization');
            if (select) {
                select.innerHTML = _organizations.map(o =>
                    '<option value="' + escAttr(o.id) + '">' + escHtml(o.name) + ' (' + escHtml(o.id) + ')</option>'
                ).join('');
            }
        }

        function escHtml(s) {
            const d = document.createElement('div');
            d.textContent = s || '';
            return d.innerHTML;
        }

        function escAttr(s) {
            return String(s || '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/'/g, '&#39;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        function shutdownServer() {
            if (!confirm('确认关闭服务器？')) return;
            fetch('/shutdown', {method: 'POST'})
                .then(r => {
                    if (r.ok) {
                        setTimeout(() => {
                            document.body.innerHTML = '<p style="text-align:center;margin-top:100px;color:#888;">服务器已关闭。</p>';
                        }, 500);
                    } else {
                        return r.json().then(d => alert(d.error || '关闭失败'));
                    }
                })
                .catch(() => {});
        }

        init();
    </script>
</body>
</html>
