<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>因子库</title>
    <link rel="stylesheet" href="/static/css/modules/custom_factor_editor/factor_library.css">
</head>
<body data-client-mode="{{ client_mode }}">
    <main class="library-shell client-library-shell">
        <aside class="library-sidebar">
            <header class="sidebar-header">
                <div>
                    <span class="eyebrow">REGISTERED FACTORS</span>
                    <h1>因子库</h1>
                </div>
                {% set back_link_class = 'back-link' %}
                {% include 'modules/shared/home_back_link.html' %}
            </header>

            <p class="library-boundary-note">
                展示已登记的家族、因子、参数与分类；本地源码工作区不在此客户端中加载。
            </p>
            <div class="library-filter">
                <input id="factor-filter" type="search" placeholder="搜索因子、家族、分类或所有者">
                <label><input id="include-subordinates" type="checkbox"> 包含可见的下级用户</label>
            </div>
            <div id="factor-list" class="factor-list">
                <div class="empty">加载中...</div>
            </div>
        </aside>

        <section class="metadata-stage">
            <header class="source-header">
                <div>
                    <span id="factor-category" class="factor-category">REGISTERED METADATA</span>
                    <h2 id="factor-title">选择一个因子</h2>
                    <p id="factor-meta">查看因子家族、登记范围与参数。</p>
                </div>
                <span class="readonly-badge">READ ONLY</span>
            </header>
            <div id="metadata-empty" class="source-empty">
                <strong>研究从清楚的登记信息开始。</strong>
                <span>选择左侧因子，查看家族归属、产品组和参数。</span>
            </div>
            <article id="metadata-view" class="metadata-view" hidden>
                <dl class="metadata-grid">
                    <div><dt>因子家族</dt><dd id="factor-family"></dd></div>
                    <div><dt>所有者</dt><dd id="factor-owner"></dd></div>
                    <div><dt>产品组</dt><dd id="factor-product-group"></dd></div>
                    <div><dt>类型</dt><dd id="factor-kind"></dd></div>
                </dl>
                <section class="params-section">
                    <h3>参数</h3>
                    <div id="factor-params" class="param-list"></div>
                </section>
            </article>
        </section>
    </main>
    <script src="/static/js/modules/custom_factor_editor/factor_library_client.js"></script>
</body>
</html>
