<!DOCTYPE html>
<html>
<head>
    <title>单因子(家族)测试</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/modules/custom_factor_editor/custom_factor_editor.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/modules/shared/param_drawer.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/modules/shared/param_info_table.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/modules/shared/collapsible_factor_list.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/modules/single_factor_test/single_factor_shell.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    {% include 'modules/shared/mathjax_setup.html' %}
    <script src="{{ url_for('static', filename='js/modules/shared/param_drawer_utils.js') }}"></script>
</head>
<body>
    <div id="user-badge" style="position:fixed;top:10px;right:16px;z-index:1000;align-items:center;gap:8px;font-size:13px;color:#444;">
        <span id="user-badge-name" style="background:#f0f4f8;border:1px solid #d0d5dd;border-radius:14px;padding:3px 12px;"></span>
        <button id="user-logout-btn" onclick="doLogout()" style="padding:3px 10px;border:1px solid #d0d5dd;border-radius:14px;background:#fff;cursor:pointer;font-size:13px;color:#555;">退出</button>
    </div>

    <div class="app single-factor-app"
         data-initial-factor="{{ initial_factor }}"
         data-initial-factor-type="{{ initial_factor_type }}"
         data-initial-owner-username="{{ initial_owner_username }}">
        <div class="sidebar">
            <div class="sidebar-header">
                <h2>单因子(家族)测试</h2>
                {% set back_link_class = 'btn-back' %}
                {% include 'modules/shared/home_back_link.html' %}
            </div>
            <div class="sidebar-actions">
                <div class="sidebar-filter" style="margin-top:0;">
                    <input type="text" id="factor-family-filter" placeholder="搜索因子家族..." value="{{ search_query }}" oninput="filterSingleFactorFamilyList()">
                </div>
                <label style="display:flex;align-items:center;gap:6px;margin-top:8px;font-size:12px;color:#667085;cursor:pointer;">
                    <input type="checkbox" id="include-subordinate-factors" onchange="loadSingleFactorFamilyList()" {% if include_subordinates %}checked{% endif %} style="width:auto;margin:0;">
                    搜索/查看下级用户因子
                </label>
            </div>
            <div class="factor-family-list" id="factor-family-list">
                <div class="factor-family-list-empty">加载中...</div>
            </div>
        </div>

        <div class="layout-resizer" id="sidebar-resizer" title="拖拽调整侧栏宽度"></div>

        <div class="editor single-factor-main" id="editor">
            <div class="editor-header">
                <div class="editor-title" id="editor-title">选择一个因子家族开始测试</div>
            </div>
            <div class="editor-body single-factor-body" id="editor-body">
                <div class="editor-placeholder">← 从左侧选择因子家族开始测试</div>
            </div>
        </div>
    </div>

    <div id="toast-container"></div>

    <script src="{{ url_for('static', filename='js/base.js') }}"></script>
    <script src="{{ url_for('static', filename='js/modules/shared/collapsible_factor_list.js') }}"></script>
    <script src="{{ url_for('static', filename='js/modules/single_factor_test/single_factor_shell.js') }}"></script>
    <script>
        (async function() {
            try {
                const r = await fetch('/api/me');
                const d = await r.json();
                if (d.username) {
                    document.getElementById('user-badge-name').textContent = d.alias || d.username;
                }
            } catch(e) {}
        })();
        async function doLogout() {
            await fetch('/logout', { method: 'POST' });
            window.location.href = '/login';
        }
    </script>
</body>
</html>
