        function insertSnippet(code) {
            const ta = document.getElementById('code-source');
            if (!ta) return;
            // 在光标位置插入，或追加到末尾
            const start = ta.selectionStart;
            const end = ta.selectionEnd;
            const before = ta.value.substring(0, start);
            const after = ta.value.substring(end);
            const needsNewline = before.length > 0 && !before.endsWith('\n');
            ta.value = before + (needsNewline ? '\n' : '') + code + after;
            ta.focus();
            ta.selectionStart = ta.selectionEnd = start + (needsNewline ? 1 : 0) + code.length;
            _dirty = true;
        }

        // ═══════════════════════════════════════════════════════════
        // 校验 / 保存 / 取消
        // ═══════════════════════════════════════════════════════════

        async function validateCustomExpr(factorName) {
            const sourceCode = document.getElementById('code-source')?.value || '';
            const btn = document.getElementById('btn-validate-custom');
            if (!btn) return;
            btn.textContent = '校验中...';
            btn.className = 'btn-validate';
            try {
                const res = await fetch('/custom-factors/api/validate', {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ source_code: sourceCode, factor_name: factorName })
                });
                const data = await res.json();
                if (data.valid) {
                    btn.textContent = '✓ 校验通过';
                    btn.className = 'btn-validate ok';
                    if (data.tree_repr) {
                        showTreeReprPopup(factorName, data.tree_repr);
                    }
                } else {
                    btn.textContent = '✗ ' + (data.error || '无效');
                    btn.className = 'btn-validate err';
                }
            } catch(e) {
                btn.textContent = '校验失败';
                btn.className = 'btn-validate err';
            }
        }

        function showTreeReprPopup(factorName, treeRepr) {
            // 移除旧的
            const old = document.querySelector('.tree-repr-overlay');
            if (old) old.remove();
            const overlay = document.createElement('div');
            overlay.className = 'tree-repr-overlay';
            overlay.innerHTML = `<div class="tree-repr-content"><pre style="white-space:pre-wrap; font-size:13px; line-height:1.6;">${escHtml(treeRepr)}</pre><button style="margin-top:10px; padding:6px 16px;" onclick="this.closest('.tree-repr-overlay').remove()">关闭</button></div>`;
            overlay.addEventListener('click', function(e) { if (e.target === overlay) overlay.remove(); });
            document.body.appendChild(overlay);
        }

        async function saveFactor() {
            const chinese_name = document.getElementById('cfg-cn')?.value?.trim() || '';
            const description = document.getElementById('cfg-desc')?.value?.trim() || '';
            const category = document.getElementById('cfg-cat')?.value?.trim() || '自编';
            const source_code = document.getElementById('code-source')?.value?.trim() || '';

            if (!source_code) { showToast('请输入源码', 'error'); return; }

            const payload = { source_code, chinese_name, description, category };

            try {
                let res;
                if (_isNew || !_currentFactorId) {
                    res = await fetch('/custom-factors/api/create', {
                        method: 'POST', headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify(payload)
                    });
                } else {
                    res = await fetch('/custom-factors/api/update/' + _currentFactorId, {
                        method: 'POST', headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify(payload)
                    });
                }
                const data = await res.json();
                if (data.success) {
                    _dirty = false;
                    _currentFactorId = data.factor.id;
                    _isNew = false;
                    showToast('保存成功', 'success');
                    await loadFactorList();
                    // 重新 fetch 因子数据并渲染编辑器
                    const factor = data.factor;
                    renderCodeEditor(factor);
                } else {
                    showToast(data.error || '保存失败', 'error');
                }
            } catch(e) {
                showToast('网络错误', 'error');
            }
        }

        function discardEdit() {
            if (_dirty && !confirm('有未保存的修改，确定放弃？')) return;
            _currentFactorId = null;
            _isNew = false;
            _dirty = false;
            renderFactorList();
            const body = document.getElementById('editor-body');
            body.innerHTML = '<div class="editor-placeholder">← 从左侧选择因子，或点击「新建因子」</div>';
            document.getElementById('editor-footer').style.display = 'none';
            document.getElementById('editor-title').textContent = '选择一个因子开始编辑';
        }

        // ═══════════════════════════════════════════════════════════
        // 可视化编辑器模式 — 算子面板 + 拖放画布
        // ═══════════════════════════════════════════════════════════

        // 算子定义
        const OP_PALETTE = {
            leaf: [
                { key:'OPEN', label:'OPEN', desc:'开盘价' },
                { key:'HIGH', label:'HIGH', desc:'最高价' },
                { key:'LOW', label:'LOW', desc:'最低价' },
                { key:'CLOSE', label:'CLOSE', desc:'收盘价' },
                { key:'CLOSE_ADJUSTED', label:'CLOSE_ADJ', desc:'复权收盘价' },
                { key:'VOLUME', label:'VOLUME', desc:'成交量' },
                { key:'AMOUNT', label:'AMOUNT', desc:'成交额' },
            ],
            ts: [
                { key:'MA($X,$N)', label:'MA', desc:'移动平均 MA(X,N)' },
                { key:'STD($X,$N)', label:'STD', desc:'标准差 STD(X,N)' },
                { key:'REF($X,$N)', label:'REF', desc:'前移 REF(X,N)' },
                { key:'DELTA($X,$N)', label:'DELTA', desc:'差分 DELTA(X,N)' },
                { key:'LOG($X)', label:'LOG', desc:'对数 LOG(X)' },
                { key:'ABS($X)', label:'ABS', desc:'绝对值 ABS(X)' },
            ],
            cs: [
                { key:'CS_RANK($X)', label:'CS_RANK', desc:'横截面排名' },
                { key:'CS_ZSCORE($X)', label:'CS_ZSCORE', desc:'横截面标准化' },
            ],
            arith: [
                { key:'+', label:'+', desc:'加法' },
                { key:'-', label:'-', desc:'减法' },
                { key:'*', label:'*', desc:'乘法' },
                { key:'/', label:'/', desc:'除法' },
            ]
        };

        // 画布上的节点
        let _visNodes = [];
        let _visNextId = 1;
        let _visSelectedNodeId = null;
        let _visDragging = null;  // { nodeId, startX, startY, mouseX, mouseY }

        function renderVisualEditor(factor) {
            _currentMode = 'visual';
            const body = document.getElementById('editor-body');
            const footer = document.getElementById('editor-footer');
            const title = document.getElementById('editor-title');
            title.textContent = _isNew ? '新建因子（可视化）' : (factor.name || '未命名因子（可视化）');
            footer.style.display = '';

            // 尝试从 func_expr 回解析出节点
            _visNodes = [];
            _visNextId = 1;
            _visSelectedNodeId = null;
            if (factor.func_expr) {
                // 简化为从头开始（回解析太复杂）
            }

            body.innerHTML = `
                <div class="visual-layout">
                    <div class="op-palette" id="op-palette">
                        ${renderPalette()}
                    </div>
                    <div class="visual-canvas-wrap" id="visual-canvas-wrap"
                         ondragover="event.preventDefault()"
                         ondrop="onCanvasDrop(event)"
                         onclick="onCanvasClick(event)">
                        <div class="visual-canvas" id="visual-canvas">
                            <svg class="vis-edges" id="vis-edges"></svg>
                        </div>
                    </div>
                    <div class="visual-config-pane">
                        <div class="config-section">
                            <h3>节点属性</h3>
                            <div id="node-props" style="font-size:12px;color:#888;">点击画布上的节点查看属性</div>
                        </div>
                        <div class="config-section" style="margin-top:16px;">
                            <h3>基本信息</h3>
                            <div class="field">
                                <label>因子名称</label>
                                <input type="text" id="cfg-name-vis" value="${escHtml(factor.name || '')}" oninput="_dirty=true">
                            </div>
                            <div class="field">
                                <label>中文名称</label>
                                <input type="text" id="cfg-cn-vis" value="${escHtml(factor.chinese_name || '')}" oninput="_dirty=true">
                            </div>
                            <div class="field">
                                <label>分类</label>
                                <input type="text" id="cfg-cat-vis" value="${escHtml(factor.category || '自编')}" oninput="_dirty=true">
                            </div>
                        </div>
                        <div style="margin-top:12px;">
                            <button class="btn-validate" onclick="visualToExpr()" style="width:100%">🔄 生成表达式</button>
                        </div>
                        <div style="margin-top:8px;font-size:12px;color:#888;" id="visual-expr-preview"></div>
                    </div>
                </div>
            `;

            // 让算子面板中的元素可拖拽
            initPaletteDrag();
        }

        function renderPalette() {
            const labels = { leaf:'📊 数据列', ts:'⏱ 时序算子', cs:'📐 横截面算子', arith:'➕ 算术运算' };
            let html = '';
            for (const [cat, ops] of Object.entries(OP_PALETTE)) {
                html += `<h3>${labels[cat]}</h3>`;
                for (const op of ops) {
                    html += `<div class="op-block ${cat}" draggable="true"
                        data-op-key="${escHtml(op.key)}" data-op-cat="${cat}"
                        ondragstart="onOpDragStart(event)">
                        <strong>${escHtml(op.label)}</strong>
                        <div class="op-desc">${escHtml(op.desc)}</div>
                    </div>`;
                }
            }
            return html;
        }

        function initPaletteDrag() {
            document.querySelectorAll('.op-block').forEach(el => {
                el.addEventListener('dragstart', onOpDragStart);
            });
        }

        function onOpDragStart(e) {
            e.dataTransfer.setData('text/plain', JSON.stringify({
                key: e.target.closest('.op-block').dataset.opKey,
                cat: e.target.closest('.op-block').dataset.opCat,
            }));
            e.dataTransfer.effectAllowed = 'copy';
        }

        function onCanvasDrop(e) {
            e.preventDefault();
            const raw = e.dataTransfer.getData('text/plain');
            if (!raw) return;
            const op = JSON.parse(raw);
            const wrap = document.getElementById('visual-canvas-wrap');
            const rect = wrap.getBoundingClientRect();
            const x = e.clientX - rect.left + wrap.scrollLeft - 50;
            const y = e.clientY - rect.top + wrap.scrollTop - 18;

            const node = {
                id: _visNextId++,
                key: op.key,
                cat: op.cat,
                label: op.key,
                x: Math.max(0, x),
                y: Math.max(0, y),
                params: {},
            };
            _visNodes.push(node);
            renderAllVisNodes();
            _dirty = true;
            selectVisNode(node.id);
        }

        function onCanvasClick(e) {
            if (e.target.closest('.vis-node')) return;
            _visSelectedNodeId = null;
            renderAllVisNodes();
            document.getElementById('node-props').innerHTML =
                '<span style="color:#888;">点击画布上的节点查看属性</span>';
            document.getElementById('visual-expr-preview').textContent = '';
        }

        function renderAllVisNodes() {
            const canvas = document.getElementById('visual-canvas');
            // remove old nodes
            canvas.querySelectorAll('.vis-node').forEach(n => n.remove());

            for (const node of _visNodes) {
                const el = document.createElement('div');
                el.className = 'vis-node' + (node.id === _visSelectedNodeId ? ' selected' : '');
                el.style.left = node.x + 'px';
                el.style.top = node.y + 'px';
                el.dataset.nodeId = node.id;
                el.innerHTML = `
                    <button class="btn-delete-node" onclick="deleteVisNode(${node.id});event.stopPropagation()">×</button>
                    <div class="node-label">${escHtml(node.label)}</div>
                    <div class="node-sub">${escHtml(node.key)}</div>
                `;
                el.addEventListener('mousedown', (e) => onVisNodeMouseDown(e, node.id));
                el.addEventListener('click', (e) => { e.stopPropagation(); selectVisNode(node.id); });
                canvas.appendChild(el);
            }
        }

        function onVisNodeMouseDown(e, nodeId) {
            e.preventDefault();
            e.stopPropagation();
            const node = _visNodes.find(n => n.id === nodeId);
            if (!node) return;
            _visDragging = {
                nodeId,
                startX: node.x,
                startY: node.y,
                mouseX: e.clientX,
                mouseY: e.clientY,
            };
            document.addEventListener('mousemove', onVisMouseMove);
            document.addEventListener('mouseup', onVisMouseUp);
        }

        function onVisMouseMove(e) {
            if (!_visDragging) return;
            const node = _visNodes.find(n => n.id === _visDragging.nodeId);
            if (!node) return;
            const dx = e.clientX - _visDragging.mouseX;
            const dy = e.clientY - _visDragging.mouseY;
            node.x = Math.max(0, _visDragging.startX + dx);
            node.y = Math.max(0, _visDragging.startY + dy);
            renderAllVisNodes();
            _dirty = true;
        }

        function onVisMouseUp() {
            _visDragging = null;
            document.removeEventListener('mousemove', onVisMouseMove);
            document.removeEventListener('mouseup', onVisMouseUp);
        }

        function selectVisNode(nodeId) {
            _visSelectedNodeId = nodeId;
            renderAllVisNodes();
            const node = _visNodes.find(n => n.id === nodeId);
            if (!node) return;

            // 显示节点属性面板
            const props = document.getElementById('node-props');
            const catNames = { leaf:'数据列', ts:'时序算子', cs:'横截面算子', arith:'算术' };
            props.innerHTML = `
                <div class="field"><label>类型</label><span>${catNames[node.cat] || node.cat}</span></div>
                <div class="field"><label>算子</label><span>${escHtml(node.key)}</span></div>
                <div class="field"><label>标签</label><input type="text" id="vis-node-label" value="${escHtml(node.label)}" oninput="updateVisNodeLabel(${nodeId}, this.value)"></div>
            `;

            updateVisualExprPreview();
        }

        function updateVisNodeLabel(nodeId, newLabel) {
            const node = _visNodes.find(n => n.id === nodeId);
            if (node) { node.label = newLabel; renderAllVisNodes(); _dirty = true; }
        }

        function deleteVisNode(nodeId) {
            _visNodes = _visNodes.filter(n => n.id !== nodeId);
            if (_visSelectedNodeId === nodeId) _visSelectedNodeId = null;
            renderAllVisNodes();
            _dirty = true;
            updateVisualExprPreview();
        }

        // 从可视化节点生成 func_expr 字符串
        function visualToExpr() {
            if (_visNodes.length === 0) {
                document.getElementById('visual-expr-preview').textContent = '（无节点）';
                return '';
            }
            // 简单串行连接：按拓扑？这里先用最后一个节点作为根
            // 实际复杂的树状连接需要连线，先做简单版：把所有节点按 key 拼接
            const root = _visNodes[_visNodes.length - 1];
            const expr = buildExprFromNode(root);
            document.getElementById('visual-expr-preview').textContent = expr || '（无法生成表达式）';
            return expr;
        }

        function buildExprFromNode(node) {
            return node.key;  // 简化版直接返回 key
        }

        function updateVisualExprPreview() {
            const expr = visualToExpr();
            document.getElementById('visual-expr-preview').textContent = expr || '';
        }

        // 覆盖保存：可视化模式也收集 func_expr
        // saveFactor 中读取 code-expr，可视化模式需要从 _visNodes 生成
        // 我们修改 saveFactor 的判断逻辑
        const _origSaveFactor = saveFactor;
        saveFactor = async function() {
            if (_currentMode === 'visual') {
                const expr = visualToExpr();
                // 把可视化表达式写入隐藏字段，让原来的保存逻辑拿得到
                const codeTextarea = document.getElementById('code-expr');
                if (!codeTextarea) {
                    // 创建临时 textarea
                    const tmp = document.createElement('textarea');
                    tmp.id = 'code-expr';
                    tmp.style.display = 'none';
                    tmp.value = expr;
                    document.getElementById('editor-body').appendChild(tmp);
                } else {
                    codeTextarea.value = expr;
                }
                // 可视化模式下用 visual 表单的字段
                const nameEl = document.getElementById('cfg-name-vis');
                const cnEl = document.getElementById('cfg-cn-vis');
                const catEl = document.getElementById('cfg-cat-vis');
                if (nameEl && !document.getElementById('cfg-name')) {
                    // 创建隐藏的 code 字段
                    ['cfg-name','cfg-cn','cfg-cat','cfg-desc'].forEach(id => {
                        const vis = document.getElementById(id + '-vis');
                        if (vis && !document.getElementById(id)) {
                            const h = document.createElement('input');
                            h.type = 'hidden'; h.id = id; h.value = vis.value;
                            document.getElementById('editor-body').appendChild(h);
                        }
                    });
                }
            }
            return await _origSaveFactor();
        };

        // ═══════════════════════════════════════════════════════════
        // Toast
        // ═══════════════════════════════════════════════════════════

        function showToast(msg, type) {
            const c = document.getElementById('toast-container');
            const el = document.createElement('div');
            el.className = 'toast ' + type;
            el.textContent = msg;
            c.appendChild(el);
            setTimeout(() => el.remove(), 2000);
        }

        // startup
        init();

        // ═══════════════════════════════════════════════════════════
        // 参数配置右侧抽屉 (照抄 parameter_module.html 的交互模式)
        // ═══════════════════════════════════════════════════════════

        let _paramFFAlias = '';              // 当前选中的因子名/ID
        let _paramFFDef = null;              // 因子定义（含 params 数组）
        let _paramAliases = [];              // 参数别名列表（列头）
        let _paramRows = [];                 // 参数行数据 [{alias: value}, ...]
        let _paramDragSrcIdx = null;         // 拖拽源索引

        // 打开参数抽屉
        function openParamDrawer(factorName) {
            const drawer = document.getElementById('param-drawer');
            const def = getFactorDef(factorName);
            if (!def) {
                showToast('未找到因子定义: ' + factorName, 'error');
                return;
            }
            _paramFFAlias = factorName;
            _paramFFDef = def;
            _paramAliases = (def.params && def.params.length)
                ? def.params.map(p => p.alias)
                : [];
            // 初始加载已有参数行（如有），否则给一行默认值
            if (def.existing_params && def.existing_params.length) {
                _paramRows = def.existing_params.map(obj => {
                    const row = {};
                    _paramAliases.forEach(a => { row[a] = obj[a] !== undefined ? String(obj[a]) : ''; });
                    return row;
                });
            } else {
                _paramRows = [getDefaultParamRow()];
            }

            // 更新抽屉信息
            document.getElementById('param-drawer-title').textContent = '参数配置 — ' + factorName;
            document.getElementById('param-drawer-summary-text').textContent = _paramRows.length + ' 行参数';
            renderParamTable();
            loadParamTemplatesIntoSelect(); // 加载该因子的模板列表

            // 数学公式 + 因子说明（共享 util）
            const mathBlock = document.getElementById('cfe-math-block');
            const descBlock = document.getElementById('cfe-desc-block');
            const descRendered = document.getElementById('cfe-desc-rendered');
            if (descBlock) document.getElementById('cfe-desc-content').style.display = 'none';
            renderDrawerMathAndDesc(def.math_expr, def.description, mathBlock, descBlock, descRendered);

            drawer.classList.add('open');
        }

        function closeParamDrawer() {
            const drawer = document.getElementById('param-drawer');
            drawer.classList.remove('open');
        }

        function getFactorDef(factorName) {
            if (!_allFactors) return null;
            let pf = _allFactors.find(f => f.id === factorName && f.type === 'public');
            if (!pf) pf = _allFactors.find(f => f.id === factorName && f.type === 'custom');
            return pf || null;
        }

        function getDefaultParamRow() {
            const def = _paramFFDef;
            const row = {};
            _paramAliases.forEach(alias => {
                if (def && def.params) {
                    const pd = def.params.find(p => p.alias === alias);
                    row[alias] = pd ? String(pd.default ?? '') : '';
                } else {
                    row[alias] = '';
                }
            });
            return row;
        }

        // ── 渲染参数表格到抽屉 ──
        function renderParamTable() {
            const tbody = document.getElementById('param-table-body');
            if (!tbody) return;

            // 先更新表头
            const thead = document.getElementById('param-table-head');
            if (thead) {
                thead.innerHTML = '<tr>' +
                    _paramAliases.map(a => '<th>' + escHtml(a) + '</th>').join('') +
                    '<th style="width:50px;">操作</th>' +
                    '</tr>';
            }

            let html = '';
            _paramRows.forEach((row, i) => {
                html += '<tr class="param-row" draggable="true" data-idx="' + i + '" ondragstart="onParamDragStart(event,' + i + ')" ondragover="onParamDragOver(event)" ondrop="onParamDrop(event,' + i + ')" ondragend="onParamDragEnd()">';
                _paramAliases.forEach(alias => {
                    const val = row[alias] !== undefined ? row[alias] : '';
                    html += '<td><input type="text" value="' + escHtml(val) + '" ' +
                        'onchange="updateParamCell(' + i + ',\'' + escAttr(alias) + '\',this.value)"></td>';
                });
                html += '<td style="text-align:center;">' +
                    '<button class="param-btn param-btn-danger" onclick="deleteParamRow(' + i + ')">✕</button>' +
                    '</td>';
                html += '</tr>';
            });

            // 新增行（默认值填入 value，而非 placeholder）
            html += '<tr>';
            _paramAliases.forEach(alias => {
                const defVal = escHtml(getDefaultParamRow()[alias] || '');
                html += '<td><input type="text" id="param-new-' + escHtml(alias) + '" ' +
                    'value="' + defVal + '" ' +
                    'onkeydown="if(event.key===\'Enter\'){event.preventDefault();addParamRow()}" ' +
                    '></td>';
            });
            html += '<td style="text-align:center;">' +
                '<button class="param-btn" onclick="addParamRow()">＋</button>' +
                '</td>';
            html += '</tr>';

            tbody.innerHTML = html;

            // 更新摘要
            document.getElementById('param-drawer-summary-text').textContent = _paramRows.length + ' 行参数';
        }

        function updateParamCell(idx, alias, val) {
            if (_paramRows[idx] !== undefined) {
                _paramRows[idx][alias] = val;
            }
        }

        function addParamRow() {
            const row = {};
            _paramAliases.forEach(alias => {
                const input = document.getElementById('param-new-' + alias);
                row[alias] = (input && input.value) ? input.value : getDefaultParamRow()[alias] || '';
            });
            _paramRows.push(row);
            renderParamTable();
        }

        function deleteParamRow(idx) {
            _paramRows.splice(idx, 1);
            if (_paramRows.length === 0) {
                _paramRows = [getDefaultParamRow()];
            }
            renderParamTable();
        }

        // ── 拖拽重排行 ──
        function onParamDragStart(e, idx) {
            _paramDragSrcIdx = idx;
            e.target.style.opacity = '0.4';
            e.dataTransfer.effectAllowed = 'move';
        }
        function onParamDragOver(e) {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
        }
        function onParamDrop(e, targetIdx) {
            e.preventDefault();
            if (_paramDragSrcIdx !== null && _paramDragSrcIdx !== targetIdx) {
                const [row] = _paramRows.splice(_paramDragSrcIdx, 1);
                _paramRows.splice(targetIdx, 0, row);
                renderParamTable();
            }
        }
        function onParamDragEnd() {
            _paramDragSrcIdx = null;
        }

        // ── 构建 params_list（供模板保存 & 使用） ──
        function buildParamConfigParamsList() {
            return _paramRows.map(row => {
                const params = {};
                _paramAliases.forEach(alias => {
                    params[alias] = row[alias] !== undefined ? row[alias] : '';
                });
                return params;
            });
        }

        // ── 抽屉内模板管理 ──
        async function loadParamTemplatesIntoSelect() {
            const sel = document.getElementById('param-tpl-select');
            const status = document.getElementById('param-tpl-status');
            if (!sel) return;
            sel.innerHTML = '<option value="">— 选择模板 —</option>';
            try {
                const resp = await fetch('/api/params_templates/' + encodeURIComponent(_paramFFAlias));
                const data = await resp.json();
                if (data.success && data.templates) {
                    data.templates.forEach(t => {
                        sel.innerHTML += '<option value="' + t.id + '">' + escHtml(t.name) + '</option>';
                    });
                }
            } catch(e) {
                if (status) status.textContent = '加载模板列表失败';
            }
        }

        async function loadParamTemplate() {
            const sel = document.getElementById('param-tpl-select');
            const status = document.getElementById('param-tpl-status');
            if (!sel || !sel.value) {
                if (status) status.textContent = '请先选择模板';
                return;
            }
            const tplId = sel.value;
            const tplName = sel.options[sel.selectedIndex].text;
            if (status) status.textContent = '加载中...';
            try {
                const resp = await fetch('/api/params_templates/' + encodeURIComponent(_paramFFAlias) + '/' + tplId);
                const data = await resp.json();
                if (data.success && data.template && data.template.params_list) {
                    _paramRows = data.template.params_list.map(obj => {
                        const row = {};
                        _paramAliases.forEach(a => { row[a] = obj[a] !== undefined ? String(obj[a]) : ''; });
                        return row;
                    });
                    if (_paramRows.length === 0) _paramRows = [getDefaultParamRow()];
                    renderParamTable();
                    if (status) status.textContent = '✓ 已加载: ' + tplName;
                    document.getElementById('param-drawer-summary-text').textContent = _paramRows.length + ' 行参数';
                } else {
                    if (status) status.textContent = '加载失败';
                }
            } catch(e) {
                if (status) status.textContent = '网络错误';
            }
        }

        async function saveParamTemplate() {
            const name = prompt('模板名称 (用于保存当前参数配置):');
            if (!name) return;
            const status = document.getElementById('param-tpl-status');
            if (status) status.textContent = '保存中...';
            try {
                const resp = await fetch('/api/params_templates/' + encodeURIComponent(_paramFFAlias), {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: name, params_list: buildParamConfigParamsList() })
                });
                const data = await resp.json();
                if (data.success) {
                    if (status) status.textContent = '✓ 已保存: ' + name;
                    await loadParamTemplatesIntoSelect();
                } else {
                    if (status) status.textContent = '保存失败: ' + (data.error || '');
                }
            } catch(e) {
                if (status) status.textContent = '网络错误';
            }
        }

        async function updateParamTemplate() {
            const sel = document.getElementById('param-tpl-select');
            const status = document.getElementById('param-tpl-status');
            if (!sel || !sel.value) {
                if (status) status.textContent = '请先选择模板';
                return;
            }
            const tplId = sel.value;
            const tplName = sel.options[sel.selectedIndex].text;
            if (status) status.textContent = '更新中...';
            try {
                const resp = await fetch('/api/params_templates/' + encodeURIComponent(_paramFFAlias) + '/' + tplId, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ params_list: buildParamConfigParamsList() })
                });
                const data = await resp.json();
                if (data.success) {
                    if (status) status.textContent = '✓ 已更新: ' + tplName;
                } else {
                    if (status) status.textContent = '更新失败: ' + (data.error || '');
                }
            } catch(e) {
                if (status) status.textContent = '网络错误';
            }
        }

        async function deleteParamTemplate() {
            const sel = document.getElementById('param-tpl-select');
            const status = document.getElementById('param-tpl-status');
            if (!sel || !sel.value) {
                if (status) status.textContent = '请先选择模板';
                return;
            }
            const tplId = sel.value;
            const tplName = sel.options[sel.selectedIndex].text;
            if (!confirm('确定删除模板「' + tplName + '」？')) return;
            if (status) status.textContent = '删除中...';
            try {
                const resp = await fetch('/api/params_templates/' + encodeURIComponent(_paramFFAlias) + '/' + tplId, {
                    method: 'DELETE'
                });
                const data = await resp.json();
                if (data.success) {
                    if (status) status.textContent = '✓ 已删除';
                    await loadParamTemplatesIntoSelect();
                } else {
                    if (status) status.textContent = '删除失败: ' + (data.error || '');
                }
            } catch(e) {
                if (status) status.textContent = '网络错误';
            }
        }

        // ── 全因子概览（按 scope 统一模板的因子列表） ──
        let _scopeFactorsData = null;
        let _currentScopeKey = '';

        async function openAllFactorsOverlay() {
            document.getElementById('all-factors-overlay').classList.add('open');
            const body = document.getElementById('all-factors-body');
            body.innerHTML = '<p style="color:#888;">加载中...</p>';

            // 获取当前用户名作为 scope_key
            let scopeKey = _currentScopeKey;
            if (!scopeKey) {
                try {
                    const meResp = await fetch('/api/me');
                    const meData = await meResp.json();
                    scopeKey = meData.username || '';
                    _currentScopeKey = scopeKey;
                } catch(e) {
                    scopeKey = '';
                }
            }

            if (!scopeKey) {
                body.innerHTML = '<p style="color:#999;">无法获取当前用户信息</p>';
                return;
            }

            try {
                const resp = await fetch('/api/global_templates/' + encodeURIComponent(scopeKey) + '/factors');
                const data = await resp.json();
                if (data.success) {
                    _scopeFactorsData = data;
                    renderScopeFactorsOverview();
                } else {
                    body.innerHTML = '<p style="color:#999;">加载失败: ' + (data.error || '未知错误') + '</p>';
                }
            } catch(e) {
                body.innerHTML = '<p style="color:#999;">网络错误: ' + e.message + '</p>';
            }
        }

        function closeAllFactorsOverlay() {
            document.getElementById('all-factors-overlay').classList.remove('open');
        }

        function renderScopeFactorsOverview() {
            const body = document.getElementById('all-factors-body');
            const data = _scopeFactorsData;
            if (!data || !data.groups || !data.groups.length) {
                body.innerHTML = '<p style="color:#999;">该 scope 下暂无已配置的因子</p>';
                return;
            }

            const groups = data.groups;
            let totalPublic = 0, totalCustom = 0, totalUnknown = 0;
            groups.forEach(g => {
                g.factors.forEach(f => {
                    if (f.source === 'public') totalPublic++;
                    else if (f.source === 'custom') totalCustom++;
                    else totalUnknown++;
                });
            });

            let html = '<div class="all-factors-stats">';
            html += '<div class="all-factors-stat">总计: <strong>' + data.total_factors + '</strong> 个因子</div>';
            html += '<div class="all-factors-stat">公共: <strong>' + totalPublic + '</strong></div>';
            html += '<div class="all-factors-stat">自定义: <strong>' + totalCustom + '</strong></div>';
            html += '<div class="all-factors-stat">家族: <strong>' + groups.length + '</strong></div>';
            html += '</div>';

            html += '<table class="all-factors-table">';
            html += '<thead><tr>';
            html += '<th>因子名</th><th>中文名</th><th>类别</th><th>参数数量</th><th>来源</th><th>更新时间</th>';
            html += '</tr></thead><tbody>';

            for (const g of groups) {
                const items = g.factors;
                html += '<tr class="all-factors-family-group"><td colspan="6">📁 ' + escHtml(g.family) + ' (' + items.length + ')</td></tr>';
                for (const f of items) {
                    html += '<tr>';
                    html += '<td><strong>' + escHtml(f.name || f.id) + '</strong></td>';
                    html += '<td>' + escHtml(f.chinese_name || '—') + '</td>';
                    html += '<td>' + escHtml(f.category || '—') + '</td>';
                    html += '<td>' + (f.params_count || 0) + '</td>';
                    const sourceLabel = f.source === 'public' ? '公共' : (f.source === 'custom' ? '自定义' : '未知');
                    const sourceClass = f.source === 'public' ? 'tag-public' : (f.source === 'custom' ? 'tag-custom' : 'tag-unknown');
                    html += '<td><span class="tag ' + sourceClass + '">' + sourceLabel + '</span></td>';
                    html += '<td style="color:#888;font-size:12px;">' + escHtml(f.updated_at || '—') + '</td>';
                    html += '</tr>';
                }
            }

            html += '</tbody></table>';
            body.innerHTML = html;
        }
    </script>
