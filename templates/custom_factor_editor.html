<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>因子库</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/github-dark.min.css">
    <link rel="stylesheet" href="/static/css/modules/custom_factor_editor/factor_library.css">
</head>
<body>
    <main class="library-shell">
        <aside class="library-sidebar">
            <header class="sidebar-header">
                <div>
                    <span class="eyebrow">FACTOR WORKSPACE</span>
                    <h1>因子库</h1>
                </div>
                {% set back_link_class = 'back-link' %}
                {% include 'modules/shared/home_back_link.html' %}
            </header>

            <section class="workspace-card">
                <div class="workspace-heading">本地工作区</div>
                <label for="factor-source-root-input">源码目录</label>
                <input id="factor-source-root-input" type="text" placeholder="使用默认用户目录">
                <div class="workspace-actions">
                    <button data-workspace-action="save-root">保存目录</button>
                    <button data-workspace-action="build">建立</button>
                    <button data-workspace-action="sync">下载同步</button>
                    <button data-workspace-action="push" class="primary">上传入库</button>
                </div>
                <p id="workspace-status">正在读取工作区...</p>
            </section>

            <div class="library-filter">
                <input id="factor-filter" type="search" placeholder="搜索名称、分类或所有者">
                <label><input id="include-subordinates" type="checkbox"> 包含下级用户</label>
            </div>
            <div id="factor-list" class="factor-list"><div class="empty">加载中...</div></div>
        </aside>

        <section class="source-stage">
            <header class="source-header">
                <div>
                    <span id="factor-category" class="factor-category">只读源码</span>
                    <h2 id="factor-title">选择一个因子</h2>
                    <p id="factor-meta">因子编写请在本地工作区完成，提交后上传入库。</p>
                </div>
                <span class="readonly-badge">READ ONLY</span>
            </header>
            <div id="source-empty" class="source-empty">
                <strong>代码在工作区里生长，在这里被审阅。</strong>
                <span>从左侧选择因子查看源码与语法高亮。</span>
            </div>
            <pre id="source-view" class="source-view" hidden><code id="source-code" class="language-python"></code></pre>
        </section>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/languages/python.min.js"></script>
    <script src="/static/js/modules/custom_factor_editor/factor_library_readonly.js"></script>
</body>
</html>
