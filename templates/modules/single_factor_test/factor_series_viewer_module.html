<div class="module" id="factor_series_viewer_module" style="margin-top:24px;">
    <div class="section-title">因子序列查看</div>
    <div
        id="factor-series-viewer-root"
        style="border:1px solid #e5e7eb;border-radius:8px;background:#fff;padding:12px;"
    >
        <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;">
            <div>
                <div style="font-size:13px;font-weight:600;color:#1f2937;">产品序列 / 因子序列对比</div>
                <div style="font-size:12px;color:#64748b;margin-top:2px;">选择产品、合约或期限后查看因子值、价格、收益标签和事件对齐。</div>
            </div>
            <button
                type="button"
                id="factor-series-open-btn"
                style="height:28px;padding:0 10px;border:1px solid #cbd5e1;border-radius:6px;background:#f8fafc;color:#334155;font-size:12px;cursor:pointer;"
            >打开序列查看</button>
        </div>
        <div id="factor-series-viewer-body" style="display:none;margin-top:12px;border-top:1px solid #eef2f7;padding-top:12px;">
            <div style="font-size:12px;color:#64748b;">从产品树选择产品或路径，再选择因子运行 factor.evaluate，显示原始因子信号序列。</div>
            <div id="factor-series-controls" class="factor-series-controls">
                <div class="factor-series-product-picker">
                    <button type="button" id="factor-series-products-btn" class="factor-series-secondary-action">选择产品</button>
                    <span id="factor-series-path-summary" class="factor-series-path-summary"></span>
                </div>
                <label class="factor-series-field">
                    <span>因子</span>
                    <select id="factor-series-factor"><option value="">加载中...</option></select>
                </label>
                <button type="button" id="factor-series-run-btn" class="factor-series-action">运行 evaluate</button>
                <span id="factor-series-status" class="factor-series-status"></span>
            </div>
            <div id="factor-series-product-row" class="factor-series-product-row"></div>
            <div id="factor-series-chart-container" style="width:100%;min-height:360px;margin-top:10px;border:1px dashed #d8dee4;border-radius:8px;background:#fafcff;"></div>
        </div>
    </div>
</div>

<div id="factor-series-products-overlay" class="factor-series-overlay" style="display:none;">
    <div class="factor-series-overlay-panel">
        <div class="factor-series-overlay-header">
            <div>
                <div style="font-size:14px;font-weight:700;color:#1f2937;">选择产品</div>
                <div style="font-size:12px;color:#64748b;margin-top:2px;">从产品树勾选产品或路径，运行时按这些路径调用 factor.evaluate。</div>
            </div>
            <button type="button" id="factor-series-products-close" class="factor-series-icon-btn">×</button>
        </div>
        <div id="factor-series-tree" class="factor-series-tree"></div>
        <div class="factor-series-overlay-footer">
            <span id="factor-series-overlay-summary" class="factor-series-path-summary"></span>
            <button type="button" id="factor-series-products-done" class="factor-series-action">完成</button>
        </div>
    </div>
</div>

<style>
    .factor-series-controls {
        display: flex;
        gap: 8px;
        align-items: flex-end;
        flex-wrap: wrap;
        margin-top: 10px;
        padding: 8px;
        border: 1px solid #eef2f7;
        border-radius: 8px;
        background: #fbfdff;
    }
    .factor-series-product-picker {
        display: flex;
        align-items: center;
        gap: 8px;
        flex: 1 1 320px;
        min-width: 260px;
    }
    .factor-series-field {
        display: flex;
        flex-direction: column;
        gap: 3px;
        min-width: 0;
        font-size: 12px;
        color: #64748b;
    }
    .factor-series-field select {
        height: 28px;
        min-width: 0;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        background: #fff;
        color: #1f2937;
        font-size: 12px;
        padding: 0 8px;
    }
    .factor-series-controls .factor-series-field {
        min-width: 220px;
        flex: 0 1 280px;
    }
    .factor-series-action {
        height: 28px;
        border: 1px solid #2563eb;
        border-radius: 6px;
        background: #2563eb;
        color: #fff;
        font-size: 12px;
        padding: 0 10px;
        cursor: pointer;
    }
    .factor-series-secondary-action {
        height: 28px;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        background: #fff;
        color: #334155;
        font-size: 12px;
        padding: 0 10px;
        cursor: pointer;
        white-space: nowrap;
    }
    .factor-series-status {
        font-size: 12px;
        color: #64748b;
        min-height: 18px;
        align-self: center;
    }
    .factor-series-product-row {
        margin-top: 8px;
        max-width: 420px;
    }
    .factor-series-path-summary {
        display: flex;
        gap: 4px;
        flex-wrap: wrap;
        justify-content: flex-end;
        font-size: 11px;
        min-width: 0;
    }
    .factor-series-path-chip {
        display: inline-flex;
        align-items: center;

        padding: 0 6px;
        border: 1px solid #dbeafe;

        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }
    .factor-series-overlay {
        position: fixed;
        inset: 0;
        z-index: 10020;
        background: rgba(15, 23, 42, 0.38);
        align-items: center;
        justify-content: center;
        padding: 24px;
    }
    .factor-series-overlay-panel {
        width: min(920px, 96vw);
        max-height: 88vh;
        display: flex;
        flex-direction: column;
        background: #fff;
        border-radius: 10px;
        box-shadow: 0 18px 48px rgba(15, 23, 42, 0.24);
        overflow: hidden;
    }
    .factor-series-overlay-header,
    .factor-series-overlay-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 12px 14px;
        border-bottom: 1px solid #e5e7eb;
    }
    .factor-series-overlay-footer {
        border-top: 1px solid #e5e7eb;
        border-bottom: none;
        background: #f8fafc;
    }
    .factor-series-tree {
        height: min(620px, 68vh);
        overflow: auto;
        padding: 10px 14px;
        background: #fff;
    }
    .factor-series-icon-btn {
        width: 28px;
        height: 28px;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        background: #fff;
        color: #64748b;
        font-size: 18px;
        line-height: 1;
        cursor: pointer;
    }
    @media (max-width: 900px) {
        .factor-series-action {
            width: 100%;
        }
        .factor-series-controls .factor-series-field,
        .factor-series-product-picker {
            flex-basis: 100%;
        }
    }
</style>
