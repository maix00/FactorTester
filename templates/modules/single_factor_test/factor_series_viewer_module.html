<div
    class="module"
    id="factor_series_viewer_module"
    data-factor-family-alias="{{ factor_family_alias }}"
    style="margin-top:24px;"
>
    <div class="section-title">因子序列查看</div>
    <div
        id="factor-series-viewer-root"
    >
        <div id="factor-series-header" class="gt-section-title-strip gt-section-title-strip-spaced">
            <span id="factor-series-triangle" class="gt-section-toggle" aria-hidden="true">▼</span>
            <span class="gt-section-title-text">产品序列 / 因子序列对比</span>
            <div class="gt-section-title-actions" onclick="event.stopPropagation()">
                <button
                    type="button"
                    id="factor-series-run-btn"
                    class="btn btn-primary btn-sm"
                >
                    计算因子
                </button>
            </div>
        </div>
        <div id="factor-series-viewer-body" style="display:none;">
            <div id="factor-series-settings-shell" class="factor-series-settings-shell backend-settings-shell">
                <div id="factor-series-settings-tab-bar" class="factor-series-settings-tab-bar backend-settings-tab-bar"></div>
                <div id="factor-series-settings-chip-row" class="factor-series-settings-chip-row backend-settings-chip-row"></div>
                <div id="factor-series-settings-host" class="factor-series-settings-host backend-settings-host" style="display:none;"></div>
            </div>
            <div id="factor-series-result-panel" class="factor-series-result-panel">
                <div class="factor-series-result-header">
                    <div>
                        <div id="factor-series-chart-title" class="factor-series-result-title">因子序列</div>
                        <div id="factor-series-product-selected-summary" class="factor-series-result-summary"></div>
                    </div>
                    <span id="factor-series-status" class="factor-series-status"></span>
                </div>
                <div id="factor-series-result-chip-row" class="factor-series-settings-chip-row factor-series-result-chip-row"></div>
                <div id="factor-series-progress" class="ic-progress-container" style="display:none;">
                    <div class="ic-progress-bar-bg">
                        <div id="factor-series-progress-bar" class="ic-progress-bar-fill"></div>
                    </div>
                    <span id="factor-series-progress-text" class="ic-progress-text">0%</span>
                </div>
                <div id="factor-series-product-row" class="factor-series-product-row"></div>
                <div id="factor-series-chart-container" class="factor-series-main-chart"></div>
                <div id="factor-series-term-table-container" style="display:none;">
                    <div style="font-size:12px;color:#64748b;margin-bottom:6px;">期限结构表格</div>
                    <div style="overflow:auto;border:1px dashed #d8dee4;border-radius:8px;">
                        <table id="factor-series-term-table" style="width:100%;border-collapse:collapse;font-size:12px;">
                            <thead>
                                <tr>
                                    <th style="position:sticky;top:0;background:#f6f8fa;padding:6px 12px;text-align:left;border-bottom:1px solid #f0f0f0;">品种/期限</th>
                                    <th style="position:sticky;top:0;background:#f6f8fa;padding:6px 12px;text-align:left;border-bottom:1px solid #f0f0f0;">起始日期</th>
                                    <th style="position:sticky;top:0;background:#f6f8fa;padding:6px 12px;text-align:left;border-bottom:1px solid #f0f0f0;">结束日期</th>
                                </tr>
                            </thead>
                            <tbody></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    #factor-series-viewer-root {
        margin-top: 8px;
    }

    #factor-series-viewer-body {

        flex-direction: column;
        gap: 10px;

        border-bottom: 1px solid #f1f5f9;
        font-size: 11px;
    }
    .factor-series-setting-row:last-child {
        border-bottom: 0;
    }
    .factor-series-setting-row-wide {
        display: block;

        min-width: 0;
    }
    .factor-series-setting-control select,

        width: 100%;

        gap: 10px;
        align-items: flex-start;
    }
    .factor-series-result-title {
        font-size: 14px;
        font-weight: 600;
        color: #1f2937;
    }
    .factor-series-main-chart {
        width: 100%;
        min-height: 520px;
        border: 1px dashed #d8dee4;
        border-radius: 8px;

    .factor-series-product-tab {
        display: flex;
        flex-direction: column;
        gap: 8px;
        min-height: 0;
    }
    .factor-series-tab-tree-wrap {
        height: auto;

        border: 1px solid #e5e7eb;

        background: #fff;
        padding: 6px;
    }
    .factor-series-tab-tree {

    }
    .factor-series-tab-tree .fancytree-container,
    .factor-series-tab-tree .fancytree-title,
    .factor-series-tab-tree .node-description {
        font-size: 12px;
    }
    .factor-series-result-summary {
        font-size: 12px;
        color: #64748b;
        margin-top: 3px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    .factor-series-contract-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 12px;
    }
    .factor-series-contract-table th {
        position: sticky;
        top: 0;
        background: #f6f8fa;
        z-index: 1;
    }
    .factor-series-contract-table td,
    .factor-series-contract-table th {
        padding: 6px 12px;
        text-align: left;
        border-bottom: 1px solid #f0f0f0;
        white-space: nowrap;
    }
    .factor-series-contract-table a {
        color: #0078d4;

        font-weight: 600;

        text-decoration: underline;

        margin-top: 10px;
    }
    #factor-series-term-table-container {
        margin-top: 10px;
    }
    #factor-series-term-table th,
    #factor-series-term-table td {
        padding: 6px 12px;
        text-align: left;
        border-bottom: 1px solid #f0f0f0;

    }
    #factor-series-term-table a {
        color: #0078d4;

    }

<div
    class="module"
    id="factor_type_analysis_module"
    data-factor-family-alias="{{ factor_family_alias }}"
    style="margin-top:24px;"
>
    <div class="section-title">因子序列分析</div>
    <div id="factor-type-analysis-root">
        <div id="factor-type-analysis-header" class="gt-section-title-strip gt-section-title-strip-spaced">
            <span id="factor-type-analysis-triangle" class="gt-section-toggle" aria-hidden="true">▼</span>
            <span class="gt-section-title-text">因子类型分析</span>
            <div class="gt-section-title-actions" onclick="event.stopPropagation()">
                <button
                    type="button"
                    id="factor-type-analysis-run-btn"
                    class="btn btn-primary btn-sm"
                >
                    分析因子类型
                </button>
            </div>
        </div>
        <div id="factor-type-analysis-body" style="display:none;">
            <div id="factor-type-analysis-settings-shell" class="backend-settings-shell">
                <div id="factor-type-analysis-tab-bar" class="backend-settings-tab-bar"></div>
                <div id="factor-type-analysis-chip-row" class="backend-settings-chip-row"></div>
                <div id="factor-type-analysis-settings-host" class="backend-settings-host" style="display:none;"></div>
            </div>
            <div id="factor-type-analysis-result-panel" class="factor-type-analysis-result-panel">
                <div class="factor-type-analysis-result-header">
                    <div>
                        <div id="factor-type-analysis-title" class="factor-type-analysis-result-title">因子类型分析结果</div>
                        <div id="factor-type-analysis-summary" class="factor-type-analysis-result-summary"></div>
                    </div>
                    <span id="factor-type-analysis-status" class="factor-type-analysis-status"></span>
                </div>
                <div id="factor-type-analysis-result-chip-row" class="backend-settings-chip-row"></div>
                <div id="factor-type-analysis-progress" class="ic-progress-container" style="display:none;">
                    <div class="ic-progress-bar-bg">
                        <div id="factor-type-analysis-progress-bar" class="ic-progress-bar-fill"></div>
                    </div>
                    <span id="factor-type-analysis-progress-text" class="ic-progress-text">0%</span>
                </div>

                <!-- 最佳匹配类别卡片 -->
                <div id="factor-type-analysis-best-match" class="factor-type-analysis-best-match" style="display:none;"></div>

                <!-- 参照因子相关性表 -->
                <div id="factor-type-analysis-ref-table" class="factor-type-analysis-table-wrap" style="display:none;">
                    <div style="font-size:12px;color:#64748b;margin-bottom:6px;">与参照因子相关性</div>
                    <div style="overflow:auto;border:1px dashed #d8dee4;border-radius:8px;">
                        <table id="factor-type-analysis-ref-table-body" class="factor-type-analysis-data-table">
                            <thead>
                                <tr>
                                    <th>参照因子</th>
                                    <th>类别</th>
                                    <th>相关系数</th>
                                    <th>显著性(p值)</th>
                                    <th>有效期数</th>
                                </tr>
                            </thead>
                            <tbody></tbody>
                        </table>
                    </div>
                </div>

                <!-- 按类别聚合 -->
                <div id="factor-type-analysis-category-section" class="factor-type-analysis-table-wrap" style="display:none;">
                    <div style="font-size:12px;color:#64748b;margin-bottom:6px;">因子类别聚合</div>
                    <div style="overflow:auto;border:1px dashed #d8dee4;border-radius:8px;">
                        <table id="factor-type-analysis-category-table" class="factor-type-analysis-data-table">
                            <thead>
                                <tr>
                                    <th>因子类别</th>
                                    <th>平均相关性</th>
                                    <th>判断</th>
                                </tr>
                            </thead>
                            <tbody></tbody>
                        </table>
                    </div>
                </div>

                <!-- 品种相关性矩阵 -->
                <div id="factor-type-analysis-product-section" class="factor-type-analysis-table-wrap" style="display:none;">
                    <div style="font-size:12px;color:#64748b;margin-bottom:6px;">品种相关性矩阵</div>
                    <div id="factor-type-analysis-product-matrix" style="overflow:auto;border:1px dashed #d8dee4;border-radius:8px;">
                    </div>
                </div>

                <!-- 产品摘要 -->
                <div id="factor-type-analysis-product-summary-section" class="factor-type-analysis-table-wrap" style="display:none;">
                    <div style="font-size:12px;color:#64748b;margin-bottom:6px;">产品数据摘要</div>
                    <div style="overflow:auto;border:1px dashed #d8dee4;border-radius:8px;">
                        <table id="factor-type-analysis-product-summary-table" class="factor-type-analysis-data-table">
                            <thead>
                                <tr>
                                    <th>产品</th>
                                    <th>有效期数</th>
                                    <th>均值</th>
                                    <th>标准差</th>
                                </tr>
                            </thead>
                            <tbody></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
