<div class="module" id="factor_series_viewer_module" style="margin-top:24px;">
    <div class="section-title">因子序列查看</div>
    <div
        id="factor-series-viewer-root"
    >
        <div id="factor-series-header" class="gt-section-title-strip gt-section-title-strip-spaced">
            <span id="factor-series-triangle" class="gt-section-toggle" aria-hidden="true">▼</span>
            <span class="gt-section-title-text">产品序列 / 因子序列对比</span>
            <div class="gt-section-title-actions" onclick="event.stopPropagation()">
                <button
                    type="button"
                    id="factor-series-run-btn"
                    class="btn btn-primary btn-sm"
                >
                    计算因子
                </button>
            </div>
        </div>
        <div id="factor-series-viewer-body" style="display:none;">
            <div id="factor-series-controls" class="factor-series-controls">
                <label class="factor-series-control-block factor-series-field">
                    <span class="factor-series-control-subtitle">产品</span>
                    <div class="factor-series-product-picker">
                    <button type="button" id="factor-series-products-btn" class="factor-series-secondary-action">从产品树选择产品</button>
                        <span id="factor-series-path-summary" class="factor-series-path-summary"></span>
                    </div>
                </label>
                <label class="factor-series-control-block factor-series-field">
                    <span class="factor-series-control-subtitle">因子</span>
                    <select id="factor-series-factor"><option value="">加载中...</option></select>
                </label>
                <span id="factor-series-status" class="factor-series-status"></span>
            </div>
            <div id="factor-series-progress" class="ic-progress-container" style="display:none;">
                <div class="ic-progress-bar-bg">
                    <div id="factor-series-progress-bar" class="ic-progress-bar-fill"></div>
                </div>
                <span id="factor-series-progress-text" class="ic-progress-text">0%</span>
            </div>
            <div id="factor-series-product-row" class="factor-series-product-row"></div>
            <div id="factor-series-chart-container" style="width:100%;min-height:360px;border:1px dashed #d8dee4;border-radius:8px;background:#fafcff;"></div>
            <div id="factor-series-term-table-container" style="display:none;">
                <div style="font-size:12px;color:#64748b;margin-bottom:6px;">期限表</div>
                <div style="overflow:auto;border:1px dashed #d8dee4;border-radius:8px;">
                    <table id="factor-series-term-table" style="width:100%;border-collapse:collapse;font-size:12px;">
                        <thead>
                            <tr>
                                <th style="position:sticky;top:0;background:#f6f8fa;padding:6px 12px;text-align:left;border-bottom:1px solid #f0f0f0;">合约</th>
                                <th style="position:sticky;top:0;background:#f6f8fa;padding:6px 12px;text-align:left;border-bottom:1px solid #f0f0f0;">起始日期</th>
                                <th style="position:sticky;top:0;background:#f6f8fa;padding:6px 12px;text-align:left;border-bottom:1px solid #f0f0f0;">结束日期</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<div id="factor-series-products-overlay" class="factor-series-overlay" style="display:none;">
    <div class="factor-series-overlay-panel">
        <div class="factor-series-overlay-header">
            <div id="factor-series-overlay-title" class="factor-series-overlay-title">产品选择</div>
            <button type="button" id="factor-series-products-close" class="factor-series-icon-btn" aria-label="关闭">×</button>
        </div>
        <div class="factor-series-overlay-body">
            <div class="factor-series-overlay-left">
                <div class="factor-series-overlay-left-title">📋 品种列表</div>
                <div class="factor-series-overlay-tree-wrap">
                    <div id="factor-series-tree-container" class="factor-series-overlay-tree"></div>
                </div>
            </div>
            <div class="factor-series-overlay-right">
                <div id="factor-series-chart-title" class="factor-series-overlay-chart-title">— 请选择品种 —</div>
                <div id="factor-series-product-selected-summary" style="font-size:12px;color:#64748b;padding:0 12px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;"></div>
                <div class="factor-series-overlay-controls">
                    <label>数据源：</label>
                    <select id="factor-series-data-source" onchange="document.getElementById('factor-series-freq').value=''; factorSeriesLoadPriceData()">
                        <option value="">自动</option>
                    </select>
                    <label>频率：</label>
                    <select id="factor-series-freq" onchange="document.getElementById('factor-series-data-source').value=''; factorSeriesLoadPriceData()">
                        <option value="">自动</option>
                    </select>
                    <span id="factor-series-price-type-wrap">
                        <label style="margin-left:12px;">价格类型：</label>
                        <select id="factor-series-price-type" onchange="factorSeriesSetAdjusted(this.value === 'adjusted')">
                            <option value="raw">原始</option>
                            <option value="adjusted">复权</option>
                        </select>
                    </span>
                </div>
                <div id="factor-series-price-chart" class="factor-series-price-chart"></div>
                <div id="factor-series-contract-table-container" style="display:none;">
                    <table id="factor-series-contract-table" class="factor-series-contract-table">
                        <thead>
                            <tr>
                                <th>合约</th>
                                <th>起始日期</th>
                                <th>结束日期</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    #factor-series-viewer-root {
        margin-top: 8px;
    }

    #factor-series-viewer-body {
        margin-top: 12px;
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        background: #fff;
        padding: 12px;
        overflow: hidden;
    }

    .factor-series-controls {
        display: grid;
        grid-template-columns: 1fr 1fr;
        align-items: start;
        column-gap: 8px;
        row-gap: 8px;
        gap: 8px;
        margin-top: 10px;
        padding: 8px;
        border: 1px solid #eef2f7;
        border-radius: 8px;
        background: #fbfdff;
    }
    .factor-series-control-block {
        display: flex;
        flex-direction: column;
        gap: 4px;
        min-width: 0;
    }
    .factor-series-product-picker {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
    }
    .factor-series-control-subtitle {
        width: auto;
        margin: 0;
        font-size: 12px;
        color: #64748b;
        line-height: 1.4;
    }
    .factor-series-field {
        display: flex;
        flex-direction: column;
        gap: 3px;
        min-width: 0;
        font-size: 12px;
        color: #64748b;
    }
    .factor-series-field select {
        height: 28px;
        min-width: 0;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        background: #fff;
        color: #1f2937;
        font-size: 12px;
        padding: 0 8px;
    }
    .factor-series-status {
        grid-column: 1 / -1;
        align-self: start;
        min-height: 0;
    }
    .factor-series-status:empty {
        display: none;
    }
    .factor-series-secondary-action {
        height: 28px;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        background: #fff;
        color: #334155;
        font-size: 12px;
        padding: 0 10px;
        cursor: pointer;
        white-space: nowrap;
    }
    .factor-series-status {
        font-size: 12px;
        color: #64748b;
    }
    .factor-series-product-row {
        margin-top: 8px;
        max-width: 420px;
    }
    .factor-series-path-summary {
        display: flex;

        flex-wrap: wrap;
        justify-content: flex-start;
        font-size: 11px;
        min-width: 0;
    }
    .factor-series-path-chip {
        display: inline-flex;
        align-items: center;
        max-width: 180px;
        height: 20px;

        border: 1px solid #dbeafe;
        border-radius: 999px;
        background: #eff6ff;
        color: #1d4ed8;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }
    .factor-series-overlay {
        position: fixed;
        inset: 0;
        z-index: 10020;
        background: rgba(15, 23, 42, 0.38);
        align-items: center;
        justify-content: center;
        padding: 24px;
    }
    .factor-series-overlay-panel {
        display: flex;
        flex-direction: column;
        background: #fff;
        border-radius: 10px;
        box-shadow: 0 18px 48px rgba(15, 23, 42, 0.24);
        overflow: hidden;
        width: min(1020px, 96vw);
        max-height: 90vh;
        min-height: min(86vh, 680px);
    }
    .factor-series-overlay-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 14px;
        border-bottom: 1px solid #e5e7eb;
        background: #f9fafb;
        gap: 10px;
    }
    .factor-series-overlay-title {
        font-weight: 600;
        color: #1f2937;
        font-size: 15px;
    }
    .factor-series-overlay-body {
        display: grid;
        grid-template-columns: minmax(320px, 42%) minmax(360px, 1fr);
        min-height: 0;
        height: min(86vh, 680px);
    }
    .factor-series-overlay-left {
        min-width: 0;
        min-height: 0;
        border-right: 1px solid #e5e7eb;
        display: flex;
        flex-direction: column;
    }
    .factor-series-overlay-right {
        min-width: 0;
        min-height: 0;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        padding: 6px 0;
    }
    .factor-series-overlay-left-title {
        padding: 8px 12px;
        border-bottom: 1px solid #eef2f7;
        font-size: 12px;
        font-weight: 700;
        color: #475467;
    }
    .factor-series-overlay-tree-wrap {
        flex: 1 1 0;
        min-height: 0;
        overflow: auto;
        padding: 8px;
        background: #fff;
    }
    .factor-series-overlay-tree {
        width: 100%;
        height: 100%;
        overflow: auto;
        box-sizing: border-box;
    }
    .factor-series-overlay-chart-title {
        padding: 0 12px 8px;
        font-size: 14px;
        font-weight: 600;
        color: #1f2937;
    }
    .factor-series-overlay-controls {
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
        padding: 0 12px 10px;
        border-bottom: 1px solid #e5e7eb;
    }
    .factor-series-overlay-controls label {
        font-size: 12px;
        color: #555;
    }
    .factor-series-overlay-controls select {
        font-size: 12px;
        padding: 4px 8px;
        border: 1px solid #d0d5dd;
        border-radius: 4px;
    }
    .factor-series-price-chart {
        width: 100%;
        height: 440px;
        min-height: 360px;
        overflow: hidden;
        padding: 0 4px;
    }
    .factor-series-contract-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 12px;
    }
    .factor-series-contract-table th {
        position: sticky;
        top: 0;
        background: #f6f8fa;
        z-index: 1;
    }
    .factor-series-contract-table td,
    .factor-series-contract-table th {
        padding: 6px 12px;
        text-align: left;
        border-bottom: 1px solid #f0f0f0;
        white-space: nowrap;
    }
    .factor-series-contract-table a {
        color: #0078d4;
        text-decoration: none;
        font-weight: 600;
    }
    .factor-series-contract-table a:hover {
        text-decoration: underline;
    }
    #factor-series-chart-container {
        margin-top: 10px;
    }
    #factor-series-term-table-container {
        margin-top: 10px;
    }
    #factor-series-term-table th,
    #factor-series-term-table td {
        padding: 6px 12px;
        text-align: left;
        border-bottom: 1px solid #f0f0f0;
        white-space: nowrap;
    }
    #factor-series-term-table a {
        color: #0078d4;
        text-decoration: none;
        font-weight: 600;
    }
    #factor-series-term-table a:hover {
        text-decoration: underline;
    }
    #factor-series-term-table .contract-name-muted {
        color: #8a94a6;
    }
.factor-series-icon-btn {
        width: 28px;
        height: 28px;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        background: #fff;
        color: #64748b;
        font-size: 18px;
        line-height: 1;
        cursor: pointer;
    }
    @media (max-width: 900px) {
        #factor-series-run-btn {
            width: 100%;
        }
        .factor-series-controls {
            grid-template-columns: 1fr;
        }
        .factor-series-overlay {
            padding: 8px;
        }
        .factor-series-overlay-body {
            grid-template-columns: 1fr;
            height: min(90vh, 760px);
        }
        .factor-series-overlay-left {
            border-right: 0;
            border-bottom: 1px solid #e5e7eb;
            height: 38vh;
            min-height: 220px;
        }
    }
</style>
