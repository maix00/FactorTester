<!-- 产品类别摘要行 -->
<div class="setting-summary-row" onclick="document.getElementById('category-drawer').classList.add('open');document.getElementById('user-badge').style.display='none';if(window.ensureCategoryTreeReady)window.ensureCategoryTreeReady()">
    <span class="setting-summary-label">🌳 产品类别</span>
    <span class="setting-summary-value multiline" id="category-summary-text">加载中…</span>
    <span class="setting-summary-arrow">编辑 ▶</span>
</div>

<!-- 产品类别抽屉 -->
<div class="settings-drawer-overlay" id="category-drawer"
     onclick="if(event.target===this){this.classList.remove('open');document.getElementById('user-badge').style.display=''}">
    <div class="settings-drawer-panel">
        <button class="drawer-close-btn"
                onclick="document.getElementById('category-drawer').classList.remove('open');document.getElementById('user-badge').style.display=''">✕ 关闭</button>

<div class="module" id="category_filter_module" style="margin-top:24px;">
    <!-- 布局由 ProductSelector.render() 生成 -->
    <!-- Toolbar 模板元素（隐藏），JS 读取后拼入渲染 -->
    <div id="category-toolbar-tpl" style="display:none;">
        <select id="tpl-select" style="min-width:140px;font-size:13px;padding:3px 6px;border:1px solid #ddd;border-radius:5px;height:30px;">
            <option value="">— 选择模板 —</option>
        </select>
        <span id="tpl-name-label" title="双击重命名" style="display:none;font-size:13px;color:#0078d4;cursor:pointer;padding:2px 6px;border-radius:4px;border:1px dashed transparent;line-height:22px;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;"
            onmouseover="this.style.borderColor='#0078d4'" onmouseout="this.style.borderColor='transparent'"></span>
        <input id="tpl-name-input" type="text" style="display:none;font-size:13px;padding:2px 6px;border:1px solid #0078d4;border-radius:4px;width:140px;height:28px;box-sizing:border-box;">
        <button id="tpl-load-btn" title="加载选中模板的路径到提交区" style="font-size:12px;padding:4px 12px;background:#0078d4;color:#fff;border:none;border-radius:5px;cursor:pointer;">加载</button>
        <button id="tpl-save-btn" title="将当前所有提交路径保存为新模板" style="font-size:12px;padding:4px 12px;background:#28a745;color:#fff;border:none;border-radius:5px;cursor:pointer;">另存为…</button>
        <button id="tpl-update-btn" title="用当前所有提交路径覆盖选中模板" style="font-size:12px;padding:4px 12px;background:#fd7e14;color:#fff;border:none;border-radius:5px;cursor:pointer;">更新</button>
        <button id="tpl-delete-btn" title="删除选中模板" style="font-size:12px;padding:4px 12px;background:transparent;color:#d00;border:1px solid #faa;border-radius:5px;cursor:pointer;">删除</button>
        <span style="color:#ccc;">|</span>
        <button id="pg-import-btn" title="从产品组导入路径" style="font-size:12px;padding:4px 12px;background:#6c63ff;color:#fff;border:none;border-radius:5px;cursor:pointer;">📥 从产品组导入</button>
        <span id="tpl-status" style="font-size:12px;white-space:nowrap;"></span>
    </div>
</div>

<!-- 依赖资源 -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/jquery.fancytree/2.38.2/skin-win8/ui.fancytree.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.fancytree/2.38.2/jquery.fancytree-all-deps.min.js"></script>
<script src="{{ url_for('static', filename='js/modules/shared/resizable_tree_container.js') }}"></script>

<script src="{{ url_for('static', filename='js/modules/products/product_group_shared.js') }}"></script>
<script src="{{ url_for('static', filename='js/modules/products/product_selector.js') }}"></script>
<script src="{{ url_for('static', filename='js/modules/single_factor_test/category_filter_module.js') }}"></script>

    </div><!-- /.settings-drawer-panel -->
</div><!-- /.settings-drawer-overlay #category-drawer -->

<script>
(function () {
    function updateCategorySummary() {
        var el = document.getElementById('category-summary-text');
        if (!el) return;
        var subs = window.submissions;
        if (!Array.isArray(subs) || subs.length === 0) {
            el.textContent = '未选择';
            return;
        }
        // 每个 submission 一行，内部每个 path 一行，显示标签名
        var lines = [];
        subs.forEach(function(sub, si) {
            var label = sub.label || ('提交 #' + (si + 1));
            var pathLines = (sub.paths || []).map(function(p) {
                return '  ' + p;
            });
            if (pathLines.length > 0) {
                lines.push(label + ':');
                lines = lines.concat(pathLines);
            }
        });
        el.innerHTML = lines.length > 0
            ? lines.map(function(l) { return '<div>' + l + '</div>'; }).join('')
            : '未选择';
    }
    window.updateCategorySummary = updateCategorySummary;
    var drawer = document.getElementById('category-drawer');
    if (drawer) {
        drawer.addEventListener('transitionend', function () {
            if (!this.classList.contains('open')) updateCategorySummary();
        });
    }
    // window.submissions 由 category_filter_module.js 约定暴露，
    // 它在提交或删除后可能更新，简单轮询即可
    function initCategorySummary() {
        setInterval(updateCategorySummary, 1000);
        updateCategorySummary();
    }
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initCategorySummary);
    } else {
        initCategorySummary();
    }
})();
</script>
