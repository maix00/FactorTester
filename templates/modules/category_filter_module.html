<div class="module" id="category_filter_module">
    <div class="section-title">产品类别筛选</div>
    <div style="display:flex;gap:20px;flex-wrap:wrap;">
        <div style="flex:1;min-width:200px;">
            <div style="margin-bottom:10px;color:#888;font-size:12px;">树状结构，勾选后提交</div>
            <div style="margin-bottom:10px;">
                <button type="button" id="submit-selected" style="background:#0078d4;color:#fff;border:none;border-radius:4px;padding:4px 12px;font-size:13px;">
                    提交选中产品
                </button>
                <span id="submit_status" style="margin-left:10px;color:#888;font-size:12px;"></span>
            </div>
            <div id="tree-container" style="max-height:300px;overflow-y:auto;border:1px solid #eee;border-radius:4px;padding:8px;">
                <div style="color:#888;text-align:center;padding:20px;">
                    产品树加载中...
                </div>
            </div>
        </div>
        <div style="width:350px;border-left:1px solid #ddd;padding-left:16px;">
            <div style="font-size:14px;font-weight:bold;margin-bottom:10px;">已提交的路径列表</div>
            <div id="submission-history" style="max-height:300px;overflow-y:auto;">
                <div style="color:#888;text-align:center;padding:20px;">
                    暂无提交记录
                </div>
            </div>
        </div>
    </div>
</div>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/jquery.fancytree/2.38.2/skin-win8/ui.fancytree.min.css">
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.fancytree/2.38.2/jquery.fancytree-all-deps.min.js"></script>

<script>
// 产品筛选功能（简化版，后续完善）
document.addEventListener('DOMContentLoaded', function() {
    const treeContainer = document.getElementById('tree-container');
    if (treeContainer) {
        treeContainer.innerHTML = '<div style="color:#888;text-align:center;padding:20px;">产品筛选功能开发中</div>';
    }
});
</script>
