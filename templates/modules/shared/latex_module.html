<!-- 数学公式（始终可见） -->
{% if math_expr %}
<div id="latex-math-block" style="background:#fafbfc;border-radius:6px;padding:16px;font-size:18px;margin-bottom:10px;text-align:center;overflow:hidden;">
    $$ {{ math_expr }} $$
</div>
<script>
(function() {
    function fit() {
        if (window.fitMathJaxToContainer) {
            window.fitMathJaxToContainer(document.getElementById('latex-math-block'));
        }
    }
    if (window.MathJax && window.MathJax.startup && window.MathJax.startup.promise) {
        window.MathJax.startup.promise.then(fit);
    } else {
        setTimeout(fit, 300);
    }
    window.addEventListener('resize', fit);
})();
</script>
{% endif %}

<!-- 因子说明摘要行（公式下方） -->
<div class="setting-summary-row" id="latex-summary-row" onclick="(function(module,btn){var isOpen=module.style.display!=='none';module.style.display=isOpen?'none':'';btn.textContent=isOpen?'▼ 展开':'▲ 收起';})(document.getElementById('latex-content'),this.querySelector('.latex-toggle'))">
    <span class="setting-summary-label">📖 因子说明</span>
    <span class="setting-summary-value" id="latex-summary-text">
        {% if description %}有说明{% else %}-{% endif %}
    </span>
    <span class="latex-toggle" style="font-size:12px;color:#4a90d9;flex-shrink:0;padding:2px 8px;border:1px solid #d0d5dd;border-radius:10px;">▼ 展开</span>
</div>

<!-- 因子说明展开区（Markdown 渲染） -->
<div id="latex-content" style="display:none;margin-bottom:10px;border:1px solid #e5e7eb;border-radius:10px;background:#ffffff;padding:18px;">
    {% if description %}
        <div id="latex-description-md" style="display:none;">{{ description | tojson }}</div>
        <div id="latex-description-rendered" style="font-size:14px;line-height:1.75;color:#374151;"></div>
        <script>
        (function() {
            const rawEl = document.getElementById('latex-description-md');
                const outEl = document.getElementById('latex-description-rendered');
                if (rawEl && outEl) {
                try {
                    outEl.innerHTML = marked.parse(JSON.parse(rawEl.textContent));
                } catch(e) {
                    outEl.textContent = rawEl.textContent;
                }
            }
        })();
        </script>
    {% else %}
        <span style="color:#888;">该因子暂未提供说明</span>
    {% endif %}
</div>
