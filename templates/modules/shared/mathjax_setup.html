<style>
    /* MathJax 异步加载期间隐藏整个 body，防止 LaTeX 源码 FOUC */
    html.mathjax-loading body { visibility: hidden; }
</style>
<script>
    document.documentElement.classList.add('mathjax-loading');
    // 兜底：8 秒后无论如何显示（MathJax CDN 超时/失败时页面不会永久白屏）
    setTimeout(function() {
        document.documentElement.classList.remove('mathjax-loading');
    }, 8000);
    window.MathJax = {
        loader: { load: ['[tex]/colorv2'] },
        tex: {
            packages: {'[+]': ['colorv2']},
            inlineMath: [['$','$'],['\\(','\\)']]
        },
        options: { skipHtmlTags: ['script','noscript','style','textarea'] },
        startup: {
            ready: function() {
                MathJax.startup.defaultReady();
                MathJax.startup.promise.then(function() {
                    document.documentElement.classList.remove('mathjax-loading');
                });
            }
        }
    };
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-svg.js" async></script>
