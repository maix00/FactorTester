{% if param_metas %}
<div class="module param-info-module">
    <div class="section-title">参数列表</div>
    <table class="param-info-table">
        <thead>
            <tr>
                <th>别名</th>
                <th>类型</th>
                <th>默认值</th>
            </tr>
        </thead>
        <tbody>
            {% for param in param_metas %}
            <tr>
                <td title="{{ ((param.name or param.alias) ~ ('\n' ~ param.desc if param.desc and param.desc != (param.name or param.alias) else '')) | e }}">{{ param.alias }}</td>
                <td title="{{ (param.value_space_desc or '') | e }}">{{ param.type or '—' }}</td>
                <td>{{ param.default_value if param.default_value is not none else '' }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endif %}
