<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <title>多因子分析 — GTHT</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <!-- Highcharts -->
    <script src="https://code.highcharts.com/stock/highstock.js"></script>
    <script src="https://code.highcharts.com/highcharts-more.js"></script>
    <script src="https://code.highcharts.com/modules/heatmap.js"></script>
    <script src="https://code.highcharts.com/modules/accessibility.js"></script>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        body { background: #f5f7fa; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        .mf-wrapper { max-width: 1200px; margin: 0 auto; padding: 24px; }
        .mf-header { display: flex; align-items: center; gap: 16px; margin-bottom: 24px; }
        .mf-header h1 { font-size: 22px; color: #1a1a1a; margin: 0; }
        .mf-header .back-link { font-size: 13px; color: #4a90d9; text-decoration: none; }
        .mf-header .back-link:hover { text-decoration: underline; }
        .mf-card {
            background: #fff; border: 1px solid #e2e8f0; border-radius: 10px;
            padding: 20px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        .mf-card h3 { font-size: 16px; color: #1a1a1a; margin: 0 0 16px; padding-bottom: 10px; border-bottom: 1px solid #eef2f7; }
        .mf-row { display: flex; gap: 16px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
        .mf-row label { font-size: 13px; color: #555; font-weight: 500; margin-bottom: 0; }
        .mf-row select, .mf-row input { font-size: 13px; padding: 6px 10px; border: 1px solid #d0d5dd; border-radius: 6px; }
        .mf-status { font-size: 13px; margin-left: 12px; }
        .mf-chart-container { width: 100%; height: 400px; margin-top: 12px; }
        .factor-tag {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 4px 10px; border-radius: 14px; font-size: 12px;
            background: #f0f4f8; border: 1px solid #d0d5dd; cursor: pointer;
            user-select: none; transition: all 0.15s;
        }
        .factor-tag.selected { background: #dbeafe; border-color: #4a90d9; color: #1e40af; }
        .factor-tag:hover { border-color: #4a90d9; }
        .factor-tag .tag-ic { font-size: 10px; color: #888; }
        .factor-tags-wrap { display: flex; flex-wrap: wrap; gap: 6px; }
        .corr-cell {
            width: 42px; height: 42px; display: flex; align-items: center; justify-content: center;
            font-size: 11px; border-radius: 4px; font-weight: 500;
        }
        .corr-table { border-collapse: collapse; margin: 0 auto; }
        .corr-table td { padding: 1px; }
        .corr-table .label-cell { font-size: 11px; color: #555; padding: 4px 8px; text-align: right; white-space: nowrap; max-width: 100px; overflow: hidden; text-overflow: ellipsis; }
        .corr-table .label-col { font-size: 11px; color: #555; padding: 4px 8px; text-align: left; white-space: nowrap; max-width: 100px; overflow: hidden; text-overflow: ellipsis; writing-mode: vertical-rl; }
        .method-btn {
            padding: 6px 16px; border: 1px solid #d0d5dd; border-radius: 6px;
            background: #fff; cursor: pointer; font-size: 13px; transition: all 0.15s;
        }
        .method-btn:hover { border-color: #4a90d9; }
        .method-btn.active { background: #4a90d9; color: #fff; border-color: #4a90d9; font-weight: 600; }
        .weight-tag {
            display: inline-block; padding: 3px 10px; border-radius: 10px;
            font-size: 12px; margin: 2px; background: #e8f5e9; color: #2e7d32;
        }
        .full-width { width: 100%; }
    </style>
</head>
<body>
<div class="mf-wrapper">
    <div class="mf-header">
        <a href="/" class="back-link">← 返回首页</a>
        <h1>🔗 多因子分析</h1>
    </div>

    <!-- 步骤1：选择测试器 & 因子 -->
    <div class="mf-card">
        <h3>1. 选择因子</h3>
        <div class="mf-row">
            <label>测试器：</label>
            <select id="mf-submission-select">
                <option value="">— 请先创建提交 —</option>
            </select>
            <label style="margin-left:16px;">因子家族：</label>
            <select id="mf-family-select">
                <option value="">加载中...</option>
            </select>
            <button id="mf-load-factors-btn" class="btn btn-sm btn-outline-primary">加载因子列表</button>
        </div>
        <div id="mf-factor-tags" class="factor-tags-wrap" style="margin-top:12px;">
            <span style="color:#888;font-size:13px;">选择测试器和因子家族后加载因子</span>
        </div>
        <div style="margin-top:8px; font-size:11px; color:#888;">
            已选: <span id="mf-selected-count">0</span> 个因子
            <button id="mf-select-all-btn" class="btn btn-sm btn-link" style="font-size:11px;">全选</button>
            <button id="mf-deselect-all-btn" class="btn btn-sm btn-link" style="font-size:11px;">全不选</button>
        </div>
    </div>

    <!-- 步骤2：相关性矩阵 -->
    <div class="mf-card">
        <h3>2. 因子相关性矩阵</h3>
        <button id="mf-run-correlation-btn" class="btn btn-primary btn-sm">计算相关性</button>
        <span id="mf-corr-status" class="mf-status"></span>
        <div class="mf-row" style="margin-top:12px;">
            <label>矩阵类型：</label>
            <button class="method-btn active" id="corr-type-spearman">Spearman</button>
            <button class="method-btn" id="corr-type-pearson">Pearson</button>
        </div>
        <div id="mf-corr-container" style="margin-top:12px; overflow-x:auto;">
            <div style="color:#888;text-align:center;padding:24px;">点击"计算相关性"查看因子间相关性矩阵</div>
        </div>
    </div>

    <!-- 步骤3：因子合成回测 -->
    <div class="mf-card">
        <h3>3. 因子合成回测</h3>
        <div class="mf-row">
            <label>合成方法：</label>
            <button class="method-btn active" data-method="equal_weight">等权</button>
            <button class="method-btn" data-method="ic_weight">IC加权</button>
            <button class="method-btn" data-method="ir_weight">IR加权</button>
            <button class="method-btn" data-method="max_sharpe">最大夏普</button>
            <button class="method-btn" data-method="min_variance">最小方差</button>
            <button class="method-btn" data-method="risk_parity">风险平价</button>
        </div>
        <div class="mf-row" style="margin-top:8px;">
            <label>收益频率：</label>
            <select id="mf-return-freq">
                <option value="">因子默认</option>
                <option value="1d">1d</option>
                <option value="3d">3d</option>
                <option value="5d">5d</option>
                <option value="10d">10d</option>
            </select>
            <label style="margin-left:12px;">分组数量：</label>
            <input type="number" id="mf-n-groups" value="5" min="2" max="10" style="width:60px;">
        </div>
        <div style="margin-top:12px;">
            <button id="mf-run-combination-btn" class="btn btn-primary btn-sm">运行合成回测</button>
            <span id="mf-combo-status" class="mf-status"></span>
        </div>
        <div id="mf-weights-container" style="margin-top:8px;"></div>
        <div id="mf-combo-chart" class="mf-chart-container" style="display:none;height:500px;"></div>
    </div>

    <!-- 步骤4：IC热力图 -->
    <div class="mf-card">
        <h3>4. 因子 IC 热力图</h3>
        <div class="mf-row">
            <label>聚合周期：</label>
            <button class="method-btn active" id="hm-group-month">月</button>
            <button class="method-btn" id="hm-group-quarter">季</button>
            <label style="margin-left:16px;">指标：</label>
            <button class="method-btn active" id="hm-metric-mean_ic">均值IC</button>
            <button class="method-btn" id="hm-metric-cum_ic">累计IC</button>
            <button class="method-btn" id="hm-metric-ir">IR</button>
            <label style="margin-left:16px;">收益频率：</label>
            <select id="mf-hm-return-freq">
                <option value="">因子默认</option>
                <option value="1d">1d</option>
                <option value="3d">3d</option>
                <option value="5d">5d</option>
                <option value="10d">10d</option>
            </select>
        </div>
        <div style="margin-top:12px;">
            <button id="mf-run-heatmap-btn" class="btn btn-primary btn-sm">生成热力图</button>
            <span id="mf-heatmap-status" class="mf-status"></span>
        </div>
        <div id="mf-heatmap-container" style="margin-top:12px; overflow-x:auto;">
            <div style="color:#888;text-align:center;padding:24px;">点击"生成热力图"查看因子 IC 在时间维度的表现</div>
        </div>
    </div>
</div>

<script src="{{ url_for('static', filename='js/modules/multi_factor_analysis/mfa.js') }}"></script>
</body>
</html>
