<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <title>产品管理 — GTHT</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <!-- Fancytree -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/jquery.fancytree/2.38.2/skin-win8/ui.fancytree.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Highcharts Stock -->
    <script src="https://code.highcharts.com/stock/highstock.js"></script>
    <script src="https://code.highcharts.com/highcharts-more.js"></script>
    <script src="https://code.highcharts.com/modules/accessibility.js"></script>
    <script src="{{ url_for('static', filename='js/modules/shared/price_display.js') }}"></script>
    <style>
        html, body { height: 100%; margin: 0; overflow: hidden; }
        body { background: #f5f7fa; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        .pv-wrapper { max-width: 100%; margin: 0 auto; padding: 16px 20px; height: 100vh; box-sizing: border-box; display: flex; flex-direction: column; min-height: 0; }
        .pv-header { display: flex; flex-direction: row; align-items: center; gap: 12px; margin-bottom: 14px; flex-shrink: 0; flex-wrap: wrap; }
        .pv-header h1 { font-size: 22px; color: #1a1a1a; margin: 0; }
        .pv-header .back-link { font-size: 13px; color: #4a90d9; text-decoration: none; margin-right: 4px; }
        .pv-header .back-link:hover { text-decoration: underline; }
        .pv-layout { display: flex; gap: 16px; flex: 1 1 auto; min-height: 0; }
        .pv-sidebar {
            width: fit-content; min-width: 0; max-width: min(70vw, 760px); flex: 0 0 auto; background: #fff; border: 1px solid #e2e8f0;
            border-radius: 10px; padding: 14px; box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            max-height: 100%; overflow: hidden; position: sticky; top: 16px;
            display: flex; flex-direction: column; min-height: 0; box-sizing: border-box;
        }
        .pv-sidebar h3 { font-size: 14px; color: #1a1a1a; margin: 0 0 8px; }
        .pv-main { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; }
        .pv-chart-card {
            background: #fff; border: 1px solid #e2e8f0; border-radius: 10px;
            padding: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            display: flex; flex-direction: column; flex: 1 1 auto;
            min-height: 0;
        }
        .pv-chart-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
        .pv-chart-header .title { font-size: 16px; font-weight: 600; color: #1a1a1a; }
        .pv-chart-header .info { font-size: 12px; color: #888; }
        .pv-controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; flex-shrink: 0; }
        .pv-controls label { font-size: 12px; color: #555; }
        .pv-controls select, .pv-controls input { font-size: 12px; padding: 4px 8px; border: 1px solid #d0d5dd; border-radius: 4px; }
        .method-btn {
            padding: 4px 12px; border: 1px solid #d0d5dd; border-radius: 4px;
            background: #fff; cursor: pointer; font-size: 12px; transition: all 0.15s;
        }
        .method-btn:hover { border-color: #4a90d9; }
        .method-btn.active { background: #4a90d9; color: #fff; border-color: #4a90d9; font-weight: 600; }
        .pv-chart-container { width: 100%; min-height: 320px; height: auto; flex: 1 1 0; overflow: hidden; }
        .pv-empty { text-align: center; padding: 80px 20px; color: #888; }
        .pv-empty .icon { font-size: 48px; margin-bottom: 16px; }
        .pv-loading { text-align: center; padding: 40px; color: #888; }
        /* 合约表格 */
        #pv-contract-table-container { flex: 0 1 auto; max-height: min(240px, 26vh); overflow: auto; border: 1px solid #e1e4e8; border-radius: 6px; background: #fff; margin-top: 10px; }
        #pv-contract-table { width: 100%; border-collapse: collapse; font-size: 12px; }
        #pv-contract-table th { position: sticky; top: 0; background: #f6f8fa; z-index: 1; }
        #pv-contract-table td, #pv-contract-table th { padding: 6px 12px; text-align: left; border-bottom: 1px solid #f0f0f0; white-space: nowrap; }
        #pv-contract-table a { color: #0078d4; text-decoration: none; font-weight: 600; }
        #pv-contract-table a:hover { text-decoration: underline; }
        #pv-contract-table .contract-name-muted { color: #8a94a6; }
        #pv-contract-table tbody tr:hover { background: rgba(255,165,0,0.08); }
        /* Fancytree 内 product-node 突出显示 */
        #pv-tree-container {
            width: 340px;
            min-width: 260px;
            max-width: min(62vw, 700px);
            box-sizing: border-box;
            resize: horizontal;
            overflow-x: auto;
            overflow-y: auto;
        }
        #pv-tree-container > ul.ui-fancytree.fancytree-container {
            display: block;
            width: 100% !important;
            max-width: 100%;
            min-width: 0;
            box-sizing: border-box;
            margin: 0;
        }
        #pv-tree-container .fancytree-title {
            white-space: normal;
            overflow-wrap: anywhere;
            word-break: break-word;
        }
        #pv-tree-container .node-description {
            white-space: normal;
            overflow-wrap: anywhere;
        }
        @media (max-width: 1024px) {
            .pv-layout { flex-direction: column; }
            .pv-sidebar {
                width: 100%;
                min-width: 0;
                flex: 0 0 auto;
                position: static;
                max-height: none;
            }
            #pv-tree-container {
                width: 100%;
                min-width: 0;
                max-width: none;
                resize: none;
                max-height: 38vh;
            }
        }
        .fancytree-container .product-node .fancytree-title { color: #0078d4; font-weight: 600; }
        .fancytree-container .disabled-contract-node .fancytree-title { color: #8a94a6; font-weight: 500; }
        .fancytree-container .product-node.active .fancytree-title { background: #dbeafe; border-radius: 4px; padding: 1px 4px; }
        .fancytree-container .node-description { color: #888; margin-left: 6px; font-size: 12px; }
    </style>
</head>
<body>
<div class="pv-wrapper">
    <div class="pv-header">
        {% set back_link_class = 'back-link' %}
        {% include 'modules/shared/home_back_link.html' %}
        <h1>📋 产品管理</h1>
        <button id="btn-product-groups" style="padding:6px 16px; font-size:13px; border:1px solid #d0d5dd; border-radius:6px; background:#fff; color:#333; cursor:pointer; white-space:nowrap;">
            📦 产品组管理
        </button>    </div>

    <div class="pv-layout">
        <!-- 左侧产品树 -->
        <div class="pv-sidebar" id="pv-sidebar">
            <h3>📋 品种列表</h3>
            <div style="margin-bottom: 8px; color: #586069; font-size: 12px;">
                树状结构，点击叶子节点查看序列
            </div>
            <!-- Fancytree 容器 -->
            <div id="pv-tree-container" style="flex:1 1 auto; min-height:0; box-sizing:border-box; overflow:auto; border:1px solid #e1e4e8; border-radius:8px; padding:8px; background:#fff;"></div>
        </div>

        <!-- 右侧图表区 -->
        <div class="pv-main">
            <div class="pv-chart-card">
                <div class="pv-chart-header">
                    <span class="title" id="pv-chart-title">— 请选择品种 —</span>
                    <span class="info" id="pv-chart-info"></span>
                </div>
                <div class="pv-controls">
                    <label>数据源：</label>
                    <select id="pv-data-source" onchange="document.getElementById('pv-freq').value=''; loadPriceData()">
                        <option value="">自动</option>
                    </select>
                    <label>频率：</label>
                    <select id="pv-freq" onchange="document.getElementById('pv-data-source').value=''; loadPriceData()">
                        <option value="">自动</option>
                    </select>
                    <span id="pv-price-type-wrap">
                    <label style="margin-left:12px;">价格类型：</label>
                    <select id="pv-price-type" onchange="setAdjusted(this.value === 'adjusted')">
                        <option value="raw">原始</option>
                        <option value="adjusted">复权</option>
                    </select>
                    </span>
                    <label style="margin-left:12px;">开始：</label>
                    <input type="date" id="pv-start-date" value="2024-01-01" onchange="loadPriceData()">
                    <label>结束：</label>
                    <input type="date" id="pv-end-date" value="" onchange="loadPriceData()">
                </div>
                <div id="pv-chart-container" class="pv-chart-container">
                    <div class="pv-empty">
                        <div class="icon">📊</div>
                        <div>从左侧列表选择品种查看序列</div>
                    </div>
                </div>
                <!-- 合约列表表格（仅 Futures 类品种显示） -->
                <div id="pv-contract-table-container" style="display:none;">
                    <table id="pv-contract-table">
                        <thead>
                            <tr>
                                <th>合约</th>
                                <th>起始日期</th>
                                <th>结束日期</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- ── Product Group Overlay ── -->
<div id="pg-overlay" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.4); z-index:999; justify-content:center; align-items:center;">
    <div style="background:#fff; border-radius:12px; width:min(90vw, 800px); max-height:85vh; display:flex; flex-direction:column; box-shadow:0 8px 40px rgba(0,0,0,0.18);">
        <!-- Header -->
        <div style="display:flex; align-items:center; justify-content:space-between; padding:16px 20px; border-bottom:1px solid #e2e8f0;">
            <h3 style="margin:0; font-size:16px;">📦 产品组管理</h3>
            <button id="pg-overlay-close" style="background:none; border:none; font-size:20px; cursor:pointer; color:#888;">&times;</button>
        </div>
        <!-- Body: 2-column -->
        <div style="display:flex; flex:1; min-height:0; overflow:hidden;">
            <!-- Left: group list → path list → product list -->
            <div style="width:260px; min-width:220px; border-right:1px solid #e2e8f0; display:flex; flex-direction:column; padding:12px; overflow:hidden;">
                <div style="display:flex; gap:6px; margin-bottom:10px; flex-shrink:0;">
                    <input id="pg-new-name" placeholder="新组名..." style="flex:1; min-width:0; padding:6px 8px; border:1px solid #d0d5dd; border-radius:4px; font-size:12px;" maxlength="30">
                    <button id="pg-btn-save" style="padding:6px 12px; font-size:12px; border:1px solid #4a90d9; border-radius:4px; background:#4a90d9; color:#fff; cursor:pointer; white-space:nowrap; flex-shrink:0;">💾 保存</button>
                </div>
                <div id="pg-group-list" style="overflow-y:auto; overflow-x:hidden; font-size:12px; word-break:break-all; flex-shrink:0; max-height:40%;"></div>
                <!-- Group detail panel: 路径列表 + 点击路径展开产品（由 renderGroupDetail 渲染） -->
                <div id="pg-group-detail" style="display:none; flex:1; overflow-y:auto; border-top:1px solid #e2e8f0; margin-top:8px; padding-top:8px; min-height:0;"></div>
            </div>
            <!-- Right: tree picker -->
            <div style="flex:1; display:flex; flex-direction:column; padding:12px; min-width:0; overflow:hidden;">
                <div style="font-size:12px; color:#666; margin-bottom:6px; flex-shrink:0;">勾选品种加入当前组（已选：<span id="pg-selected-count">0</span>）</div>
                <div id="pg-tree-container" style="flex:1; overflow:auto; border:1px solid #e1e4e8; border-radius:6px; padding:6px; background:#fafbfc; min-width:0;"></div>
            </div>
        </div>
    </div>
</div>

<!-- Fancytree + jQuery -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.fancytree/2.38.2/jquery.fancytree-all-deps.min.js"></script>
<script src="{{ url_for('static', filename='js/modules/shared/resizable_tree_container.js') }}"></script>

<script>
(function() {
    'use strict';

    // Highcharts 时区配置：后端返回 UTC epoch，useUTC=false 使得 dateFormat/formatter 按浏览器本地时区显示
    if (typeof Highcharts !== 'undefined') {
        Highcharts.setOptions({ global: { useUTC: false } });
    }

    let currentProduct = null;
    let currentAdjusted = false;
    let treeInstance = null;
    let allProductsMap = {};  // name -> product info
    let currentChart = null;  // Highcharts chart instance
    let currentContracts = []; // 当前期限结构产品的合约列表
    let highlightedRow = null; // 当前高亮的表格行

    function escHtml(value) {
        return String(value == null ? '' : value)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    // ── 合约表格 ────────────────────────────────────────
    async function loadContractsForProduct(productName) {
        var tableContainer = document.getElementById('pv-contract-table-container');
        var tbody = document.querySelector('#pv-contract-table tbody');
        tbody.innerHTML = '';
        currentContracts = [];
        highlightedRow = null;
        tableContainer.style.display = 'none';

        try {
            var resp = await fetch('/api/get_contracts?product=' + encodeURIComponent(productName));
            var data = await resp.json();
            if (data.success && data.contracts && data.contracts.length > 0) {
                currentContracts = data.contracts;
                for (var i = 0; i < data.contracts.length; i++) {
                    var c = data.contracts[i];
                    var tr = document.createElement('tr');
                    tr.setAttribute('data-idx', i);
                    tr.style.cursor = 'pointer';
                    var contractUrl = '/products?contract_uid=' + encodeURIComponent(c.uid);
                    var contractCell = c.has_data
                        ? '<a href="' + contractUrl + '" title="查看合约信息页">' + escHtml(c.contract) + '</a>'
                        : '<span class="contract-name-muted" title="暂无价格数据，不能跳转">' + escHtml(c.contract) + '</span>';
                    tr.innerHTML =
                        '<td>' + contractCell + '</td>' +
                        '<td>' + escHtml(c.start || '') + '</td>' +
                        '<td>' + escHtml(c.end || '') + '</td>';
                    var link = tr.querySelector('a');
                    if (link) {
                        link.addEventListener('click', function(event) {
                            event.stopPropagation();
                        });
                    }
                    // hover → 高亮
                    tr.addEventListener('mouseenter', (function(idx) {
                        return function() { highlightContractBand(idx); };
                    })(i));
                    tr.addEventListener('mouseleave', function() {
                        if (highlightedRow === null) clearHighlight();
                    });
                    // click → 选中/取消
                    tr.addEventListener('click', (function(idx) {
                        return function() {
                            var rows = tbody.querySelectorAll('tr');
                            if (highlightedRow === idx) {
                                highlightedRow = null;
                                rows[idx].style.background = '';
                                clearHighlight();
                            } else {
                                rows.forEach(function(r) { r.style.background = ''; });
                                highlightedRow = idx;
                                rows[idx].style.background = 'rgba(255,165,0,0.15)';
                                highlightContractBand(idx);
                            }
                        };
                    })(i));
                    tbody.appendChild(tr);
                }
            }
        } catch (e) {
            console.error('加载合约列表失败', e);
        }
    }

    function clearHighlight() {
        if (!currentChart) return;
        currentChart.xAxis.forEach(function(ax) {
            if (ax && ax.removePlotBand) {
                ax.removePlotBand('highlight');
            }
        });
    }

    function highlightContractBand(idx) {
        if (!currentChart) return;
        var c = currentContracts[idx];
        if (!c || !c.start_ts || !c.end_ts) return;

        currentChart.xAxis.forEach(function(ax) {
            if (ax && ax.removePlotBand) {
                ax.removePlotBand('highlight');
            }
        });

        currentChart.xAxis[0].addPlotBand({
            id: 'highlight',
            from: c.start_ts,
            to: c.end_ts,
            color: 'rgba(255,165,0,0.2)',
            zIndex: 5
        });
    }

    // ── Init ──────────────────────────────────────────────
    async function init() {
        document.getElementById('pv-end-date').value = new Date().toISOString().split('T')[0];
        if (typeof window.setupResizableTreeContainer === 'function') {
            window.setupResizableTreeContainer({
                outerSelector: '#pv-sidebar',
                innerSelector: '#pv-tree-container',
                minWidth: 260,
                initialWidth: 340,
                maxWidth: 'min(62vw, 700px)',
                outerMaxWidth: 'min(70vw, 760px)',
                mobileInnerMaxHeight: '38vh'
            });
        }

        // 加载品种列表用于按名称查找
        try {
            const resp = await fetch('/api/list_product_names');
            const data = await resp.json();
            if (data.success) {
                for (const p of data.products) {
                    allProductsMap[p.name] = p;
                }
            }
        } catch (e) {
            console.error('加载品种列表失败', e);
        }

        // 初始化 Fancytree 产品树
        initFancytree();
        const contractUid = new URLSearchParams(window.location.search).get('contract_uid');
        if (contractUid) {
            selectProduct(contractUid, {
                name: contractUid,
                desc: contractUid,
                code: contractUid,
                type: 'contract',
                contract_uid: contractUid
            });
        }
    }

    function initFancytree() {
        const $container = $('#pv-tree-container');
        $container.empty();
        $container.html('<div style="color:#888;text-align:center;padding:20px;">加载产品树...</div>');

        $container.fancytree({
            source: { url: '/api/product_tree' },
            checkbox: false,
            selectMode: 1,  // 单选
            init: function(event, data) {
                treeInstance = data.tree;
                $container.find('> div:first-child').remove();
            },
            lazyLoad: function(event, data) {
                var node = data.node;
                if (node.key && node.key.indexOf('CNFuturesContract') >= 0) {
                    data.result = {
                        url: '/api/contract_tree',
                        data: { path: node.key }
                    };
                    return;
                }
                data.result = {
                    url: '/get_products',
                    data: { path: node.key, checkbox: 'false' }
                };
            },
            renderNode: function(event, data) {
                var node = data.node;
                var desc = node.data.desc;
                if (desc) {
                    var $title = $(node.span).find('.fancytree-title');
                    $title.siblings('.node-description').remove();
                    $title.after('<span class="node-description">' + desc + '</span>');
                }
            },
            activate: function(event, data) {
                // 点击节点时选中产品
                var node = data.node;
                // 从节点 data 中读取 product_name（懒加载产品节点会带这个字段）
                var productName = node.data.product_name;
                if (!productName) {
                    // 非懒加载叶子节点，尝试从 key 中提取
                    productName = extractProductName(node);
                }
                if (productName && node.data.has_data !== false) {
                    selectProduct(productName, node.data || {});
                }
            }
        });
    }

    function extractProductName(node) {
        // 从节点 key 中提取产品名（fallback 当 data.product_name 不可用时）
        // key 格式如: "Product/板块/夜盘时段/产品名" 或 "Product/板块/夜盘时段/_products/..."
        if (!node || !node.key) return null;
        var parts = node.key.split('/');
        var lastPart = parts[parts.length - 1];
        // 跳过 _products 和纯数字 id
        if (lastPart === '_products' || /^[0-9]+$/.test(lastPart)) return null;
        return lastPart;
    }

    function selectProduct(name, nodeData) {
        var info = Object.assign({}, allProductsMap[name] || {}, nodeData || {});
        if (!info) {
            // 可能是直接从树节点拿到名字，尝试用 name 本身
            info = { name: name, desc: name, code: name };
        }
        if (!info.name) info.name = name;

        currentProduct = info;

        // 更新标题
        var code = info.code || (info.name ? info.name.split('.')[0] : name);
        var desc = info.desc || info.name || name;
        document.getElementById('pv-chart-title').textContent = code + ' ' + desc;
        document.getElementById('pv-chart-info').textContent = info.name || name;

        // 更新 tree 中的 visual active（移除旧 active，添加新 active）
        $('#pv-tree-container .product-node').removeClass('active');
        if (treeInstance) {
            var activeNode = treeInstance.getActiveNode();
            if (activeNode) {
                $(activeNode.span).addClass('active');
            }
        }

        // 切换品种：重置合约表格、数据源下拉框（避免跨品种粒度泄露）
        document.querySelector('#pv-contract-table tbody').innerHTML = '';
        document.getElementById('pv-contract-table-container').style.display = 'none';
        currentContracts = [];
        highlightedRow = null;
        // 重置数据源为"自动"，避免合约粒度的源泄露到品种请求
        var dsSelect = document.getElementById('pv-data-source');
        if (dsSelect) dsSelect.value = '';

        var isContract = info.product_type === 'contract' || info.contract_uid;
        if (isContract) updatePriceTypeControl(false, false);
        var contractsPromise = isContract ? Promise.resolve() : loadContractsForProduct(info.name || name);
        contractsPromise.then(function() {
            loadPriceData();
        });
    }

    window.setAdjusted = function(adjusted) {
        currentAdjusted = adjusted;
        var priceType = document.getElementById('pv-price-type');
        if (priceType) priceType.value = adjusted ? 'adjusted' : 'raw';
        if (currentProduct) loadPriceData();
    };

    async function loadPriceData(freqOverride) {
        if (!currentProduct) return;

        const container = document.getElementById('pv-chart-container');
        container.innerHTML = '<div class="pv-loading">加载中...</div>';

        // 如果传了频率覆盖，先更新下拉框
        if (freqOverride) {
            document.getElementById('pv-freq').value = freqOverride;
        }

        var body = {
            product_name: currentProduct.name || currentProduct.code,
            adjusted: currentAdjusted,
            freq: document.getElementById('pv-freq').value,
            data_source: document.getElementById('pv-data-source').value || null,
            start_date: document.getElementById('pv-start-date').value || null,
            end_date: document.getElementById('pv-end-date').value || null,
        };
        if (currentProduct.contract_uid || currentProduct.product_type === 'contract') {
            body.contract_uid = currentProduct.contract_uid || currentProduct.name;
            body.adjusted = false;
        }

        try {
            const resp = await fetch('/api/get_price_data', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            const data = await resp.json();
            if (data.success && data.data && data.data.length > 0) {
                document.getElementById('pv-chart-info').textContent =
                    `${data.product} | ${data.adjusted ? '复权' : '原始'} | ${data.freq} | ${data.count} 条`;
                updatePriceTypeControl(data.supports_adjusted, data.adjusted);
                var tableContainer = document.getElementById('pv-contract-table-container');
                if (data.supports_term_structure && !body.contract_uid && currentContracts.length > 0) {
                    tableContainer.style.display = 'block';
                } else {
                    tableContainer.style.display = 'none';
                }
                drawChart(data);
                updateFreqSelect(data.available_freqs || [], data.freq);
                updateDataSourceSelect(data.available_sources || [], data.data_source);
            } else {
                container.innerHTML = `<div class="pv-empty">
                    <div class="icon">⚠️</div>
                    <div>${data.error || '无价格数据'}</div>
                </div>`;
            }
        } catch (e) {
            console.error(e);
            container.innerHTML = `<div class="pv-empty">
                <div class="icon">⚠️</div>
                <div>网络错误</div>
            </div>`;
        }
    }
    window.loadPriceData = loadPriceData;

    function updateFreqSelect(availableFreqs, currentFreq) {
        var select = document.getElementById('pv-freq');
        if (!select) return;
        var freqLabels = {
            'MIN1':  '1分钟', 'MIN5': '5分钟', 'MIN15': '15分钟', 'MIN30': '30分钟',
            'HOUR1': '1小时', 'DAY1': '日线'
        };
        function label(f) { return freqLabels[f] || f; }
        var freqs = availableFreqs || [];
        var oldValue = currentFreq || select.value;
        if (!freqs.length) {
            select.innerHTML = '<option value="">无可用频率</option>';
            select.disabled = true;
            return;
        }
        select.disabled = false;
        select.innerHTML = freqs.map(function(f) {
            return '<option value="' + escHtml(f) + '">' + escHtml(label(f)) + '</option>';
        }).join('');
        if (oldValue && freqs.indexOf(oldValue) >= 0) {
            select.value = oldValue;
        }
    }

    function updateDataSourceSelect(availableSources, currentSource) {
        var select = document.getElementById('pv-data-source');
        if (!select) return;
        var selected = currentSource || select.value || '';
        var html = '<option value="">自动</option>';
        (availableSources || []).forEach(function(source) {
            var alias = source.alias || '';
            var label = alias + (source.freq ? ' · ' + source.freq : '');
            html += '<option value="' + escHtml(alias) + '">' + escHtml(label) + '</option>';
        });
        select.innerHTML = html;
        if (selected && Array.prototype.some.call(select.options, function(opt) { return opt.value === selected; })) {
            select.value = selected;
        }
    }

    function drawChart(data) {
        const container = document.getElementById('pv-chart-container');
        container.innerHTML = '';

        const priceSeries = window.PriceDisplay && window.PriceDisplay.normalizePriceApi
            ? window.PriceDisplay.normalizePriceApi(data)
            : null;
        const ohlc = window.PriceDisplay && window.PriceDisplay.toOhlc
            ? window.PriceDisplay.toOhlc(data.data)
            : data.data.map(d => [d.timestamp, d.open, d.high, d.low, d.close]);
        const volume = window.PriceDisplay && window.PriceDisplay.toColumn
            ? window.PriceDisplay.toColumn(data.data, 'volume')
            : data.data.map(d => [d.timestamp, d.volume]);

        const hasOI = priceSeries ? priceSeries.has_open_interest : (data.has_oi && data.data.some(d => d.open_interest != null));
        const oi = hasOI
            ? (window.PriceDisplay && window.PriceDisplay.toColumn
                ? window.PriceDisplay.toColumn(data.data, 'open_interest')
                : data.data.map(d => [d.timestamp, d.open_interest]))
            : [];

        const title = `${data.product}${data.desc ? ' — ' + data.desc : ''} (${data.adjusted ? '复权' : '原始'})`;

        // 判断是否为日内频率（非日线倍数）
        var freqStr = data.freq || '';
        var isIntraday = freqStr.indexOf('MIN') === 0 || freqStr.indexOf('HOUR') === 0 || freqStr.indexOf('SEC') === 0;

        // 合约 plotBands（Futures 类才有）
        var plotBands = [];
        if (data.supports_term_structure && data.contracts && data.contracts.length > 0) {
            plotBands = data.contracts.map(function(c, i) {
                return {
                    id: 'contract-' + i,
                    from: c.start_ts,
                    to: c.end_ts,
                    color: 'rgba(100,149,237,0.04)',
                };
            });
        }

        // 构建 yAxis 和 series
        const yAxisArr = [{
            labels: { align: 'right', x: -3 },
            title: { text: '' },
            height: hasOI ? '50%' : '60%',
            lineWidth: 2,
            resize: { enabled: true },
            plotBands: plotBands
        }, {
            labels: { align: 'right', x: -3 },
            title: { text: '' },
            top: hasOI ? '55%' : '65%',
            height: hasOI ? '25%' : '35%',
            offset: 0,
            lineWidth: 2
        }];
        const seriesArr = [{
            type: 'candlestick',
            name: data.product,
            data: ohlc,
            tooltip: {
                pointFormat:
                    '<span style="font-weight:bold">开盘</span> {point.open:.2f}<br/>' +
                    '<span style="font-weight:bold">最高</span> {point.high:.2f}<br/>' +
                    '<span style="font-weight:bold">最低</span> {point.low:.2f}<br/>' +
                    '<span style="font-weight:bold">收盘</span> {point.close:.2f}'
            }
        }, {
            type: 'column',
            name: '成交量',
            data: volume,
            yAxis: 1,
            tooltip: { valueDecimals: 0 }
        }];

        if (hasOI) {
            yAxisArr.push({
                labels: { align: 'right', x: -3 },
                title: { text: '' },
                top: '82%',
                height: '18%',
                offset: 0,
                lineWidth: 2
            });
            seriesArr.push({
                type: 'line',
                name: '持仓量',
                data: oi,
                yAxis: 2,
                color: '#E91E63',
                tooltip: { valueDecimals: 0 }
            });
        }

        // xAxis 标签：直接用 new Date(utcEpoch) 按浏览器本地时区显示
        var xAxisOptions = {
            type: 'datetime',
            labels: {
                rotation: -45,
                align: 'right',
                style: {
                    fontSize: '10px',
                    color: '#64748b'
                },
                formatter: function() {
                    var d = new Date(this.value);
                    var hh = String(d.getHours()).padStart(2, '0');
                    var mm = String(d.getMinutes()).padStart(2, '0');
                    var M = String(d.getMonth() + 1).padStart(2, '0');
                    var dd = String(d.getDate()).padStart(2, '0');
                    if (isIntraday) {
                        return hh + ':' + mm + '<br/>' + M + '-' + dd;
                    } else {
                        return M + '-' + dd;
                    }
                }
            },
            ordinal: true
        };

        var chartHeight = Math.max(320, Math.floor(container.getBoundingClientRect().height || 420));
        currentChart = Highcharts.stockChart(container, {
            chart: { animation: false, height: chartHeight },
            title: { text: title, style: { fontSize: '15px' } },
            subtitle: { text: `${data.freq} · ${data.count} 条数据`, style: { fontSize: '11px', color: '#888' } },
            rangeSelector: {
                buttons: [
                    { type: 'day',   count: 3,  text: '3天' },
                    { type: 'week',  count: 1,  text: '1周' },
                    { type: 'month', count: 1,  text: '1月' },
                    { type: 'month', count: 3,  text: '3月' },
                    { type: 'year',  count: 1,  text: '1年' },
                    { type: 'all',             text: '全部' },
                ],
                selected: 4,
            },
            xAxis: xAxisOptions,
            yAxis: yAxisArr,
            tooltip: {
                shared: true,
                useHTML: true,
                formatter: function () {
                    var d = new Date(this.x);
                    var dateStr = isIntraday ?
                        d.getFullYear() + '-' +
                        String(d.getMonth() + 1).padStart(2, '0') + '-' +
                        String(d.getDate()).padStart(2, '0') + ' ' +
                        String(d.getHours()).padStart(2, '0') + ':' +
                        String(d.getMinutes()).padStart(2, '0') + ':' +
                        String(d.getSeconds()).padStart(2, '0') :
                        d.getFullYear() + '-' +
                        String(d.getMonth() + 1).padStart(2, '0') + '-' +
                        String(d.getDate()).padStart(2, '0');
                    var s = '<b>' + dateStr + '</b>';
                    this.points.forEach(function (p) {
                        if (p.series.type === 'candlestick') {
                            s += '<br/><span style="font-weight:bold">开盘</span> ' + p.point.open.toFixed(2) +
                                 '<br/><span style="font-weight:bold">最高</span> ' + p.point.high.toFixed(2) +
                                 '<br/><span style="font-weight:bold">最低</span> ' + p.point.low.toFixed(2) +
                                 '<br/><span style="font-weight:bold">收盘</span> ' + p.point.close.toFixed(2);
                        } else {
                            var decimals = p.series.tooltipOptions.valueDecimals;
                            if (typeof decimals !== 'number') decimals = 2;
                            var val = typeof p.y === 'number' ? p.y.toFixed(decimals) : p.y;
                            s += '<br/>' + p.series.name + ': ' + val;
                        }
                    });
                    return s;
                }
            },
            series: seriesArr,
            credits: { enabled: false },
            navigator: { enabled: true },
            scrollbar: { enabled: false }
        });
    }

    function updatePriceTypeControl(supportsAdjusted, adjusted) {
        var wrap = document.getElementById('pv-price-type-wrap');
        var select = document.getElementById('pv-price-type');
        if (!wrap || !select) return;
        wrap.style.display = supportsAdjusted ? 'inline-flex' : 'none';
        wrap.style.alignItems = 'center';
        wrap.style.gap = '10px';
        currentAdjusted = Boolean(supportsAdjusted && adjusted);
        select.value = currentAdjusted ? 'adjusted' : 'raw';
    }

    window.addEventListener('resize', function() {
        if (currentChart) currentChart.reflow();
    });

    init();

    // Expose main tree instance and product map for product_group_manager.js
    window._mainTreeInstance = treeInstance;
    window._allProductsMap = allProductsMap;

})();
</script>
