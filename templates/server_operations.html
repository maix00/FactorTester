<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>服务器运行状态</title>
  <style>
    :root { color-scheme: light dark; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; color: #172033; background: #f5f7fb; }
    main { max-width: 1180px; margin: 0 auto; padding: 30px 28px 48px; }
    .page-heading { display: flex; align-items: end; justify-content: space-between; gap: 18px; margin-bottom: 24px; }
    h1 { margin: 0; font-size: 28px; letter-spacing: -.02em; }
    .subtitle { margin: 7px 0 0; color: #667085; font-size: 14px; }
    .refresh { appearance: none; border: 1px solid #d0d5dd; background: #fff; color: #344054; border-radius: 9px; padding: 8px 13px; font-weight: 600; cursor: pointer; }
    .refresh:hover { background: #f9fafb; }
    .grid { display: grid; gap: 18px; }
    .panel { background: #fff; border: 1px solid #e4e7ec; border-radius: 14px; box-shadow: 0 4px 16px rgba(16,24,40,.04); overflow: hidden; }
    .panel-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 18px 20px; border-bottom: 1px solid #eaecf0; }
    .panel-header h2 { margin: 0; font-size: 17px; }
    .count { color: #667085; font-size: 13px; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { color: #667085; background: #fcfcfd; font-weight: 600; text-align: left; }
    th, td { padding: 12px 16px; border-bottom: 1px solid #f0f1f3; white-space: nowrap; }
    tr:last-child td { border-bottom: 0; }
    .primary { font-weight: 650; color: #101828; }
    .secondary { color: #667085; margin-top: 3px; font-size: 12px; }
    .pill { display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; padding: 4px 9px; font-weight: 600; font-size: 12px; background: #f2f4f7; color: #475467; }
    .pill.running, .pill.succeeded { color: #067647; background: #ecfdf3; }
    .pill.failed, .pill.degraded { color: #b42318; background: #fef3f2; }
    .pill.queued, .pill.submitted, .pill.planning { color: #175cd3; background: #eff8ff; }
    .actions { display: flex; gap: 7px; }
    .actions button { border: 1px solid #d0d5dd; color: #344054; background: #fff; border-radius: 8px; padding: 6px 10px; cursor: pointer; }
    .actions button.primary-action { color: #fff; background: #175cd3; border-color: #175cd3; }
    button:disabled { opacity: .42; cursor: default; }
    .empty, .error { padding: 28px 20px; text-align: center; color: #667085; }
    .error { color: #b42318; }
    .notice { margin: 0 0 18px; padding: 11px 14px; border: 1px solid #b2ddff; border-radius: 10px; background: #eff8ff; color: #175cd3; font-size: 13px; }
    .pager { display: flex; justify-content: center; padding: 14px; border-top: 1px solid #eaecf0; }
    @media (prefers-color-scheme: dark) {
      body { color: #f2f4f7; background: #101318; }
      .panel, .refresh, .actions button { background: #181c23; border-color: #303640; color: #e4e7ec; }
      th { background: #151920; color: #98a2b3; }
      th, td, .panel-header, .pager { border-color: #2b313a; }
      .primary { color: #f9fafb; }
    }
  </style>
</head>
<body>
  {% include 'modules/shared/home_back_link.html' %}
  <main>
    <header class="page-heading">
      <div>
        <h1>服务器运行状态</h1>
        <p class="subtitle">进程生命周期由本机 Manager 管理；任务状态来自现有 Job 队列。</p>
        <p class="subtitle" id="server-addresses">正在读取服务器地址…</p>
      </div>
      <button class="refresh" id="refresh-all">刷新</button>
    </header>
    <div class="notice" id="action-notice" hidden></div>
    <div class="grid">
      <section class="panel" aria-labelledby="instances-title">
        <div class="panel-header">
          <h2 id="instances-title">服务实例</h2>
          <span class="count" id="instance-count">—</span>
        </div>
        <div id="instances"><div class="empty">正在读取服务状态…</div></div>
      </section>
      <section class="panel" aria-labelledby="jobs-title">
        <div class="panel-header">
          <h2 id="jobs-title">全服测试任务</h2>
          <span class="count" id="job-count">最近更新</span>
        </div>
        <div id="jobs"><div class="empty">正在读取任务队列…</div></div>
        <div class="pager" id="job-pager" hidden>
          <button class="refresh" id="load-more">加载更早任务</button>
        </div>
      </section>
    </div>
  </main>
  <script>
    const state = { nextCursor: null, jobs: [] };
    const escapeHTML = value => String(value ?? '').replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    async function jsonRequest(url, options) {
      const response = await fetch(url, {
        credentials: 'same-origin',
        headers: {'Accept':'application/json','Content-Type':'application/json'},
        ...options,
      });
      const value = await response.json().catch(() => ({}));
      if (!response.ok || value.success === false) throw new Error(value.error || `HTTP ${response.status}`);
      return value;
    }
    function status(value) {
      const key = escapeHTML(value || 'stopped');
      return `<span class="pill ${key}">${key}</span>`;
    }
    async function loadInstances() {
      const target = document.getElementById('instances');
      try {
        const value = await jsonRequest('/admin/api/server-instances');
        const rows = value.instances || [];
        const addresses = value.addresses || {};
        const loopback = addresses.loopback_ip || '127.0.0.1';
        const lan = addresses.lan_ip || '不可用';
        document.getElementById('server-addresses').textContent =
          `本机 IP：${loopback} · 局域网 IP：${lan}`;
        document.getElementById('instance-count').textContent = `${rows.length} 个实例`;
        target.innerHTML = rows.length ? `<div class="table-wrap"><table><thead><tr><th>实例</th><th>访问地址</th><th>状态</th><th>操作</th></tr></thead><tbody>${rows.map(item => {
          const allowed = new Set(item.allowed_actions || []);
          const stateLabel = item.status || 'stopped';
          const restartAPI = item.kind === 'factortester' ? `<button data-action="restart_api" title="立即重启网页与接口，后台任务继续运行" data-id="${escapeHTML(item.instance_id)}" ${allowed.has('restart_api') ? '' : 'disabled'}>重启网页</button>` : '';
          const restartBundle = item.kind === 'factortester' ? `<button data-action="restart_bundle" title="等待当前任务完成，再自动重启全部服务" data-id="${escapeHTML(item.instance_id)}" ${allowed.has('restart_bundle') ? '' : 'disabled'}>排队重启</button>` : '';
          const forceStop = item.kind === 'factortester' ? `<button data-action="force_stop" data-confirm="强制停止会中断正在运行的研究任务，确定继续吗？" data-id="${escapeHTML(item.instance_id)}" ${allowed.has('force_stop') ? '' : 'disabled'}>强制停止</button>` : '';
          const localURL = `http://${loopback}:${item.port}/`;
          const lanURL = addresses.lan_ip ? `http://${addresses.lan_ip}:${item.port}/` : '';
          const links = `<a href="${escapeHTML(localURL)}" target="_blank">${escapeHTML(localURL)}</a>${lanURL ? `<div class="secondary"><a href="${escapeHTML(lanURL)}" target="_blank">${escapeHTML(lanURL)}</a></div>` : ''}`;
          return `<tr><td><div class="primary">${escapeHTML(item.label || item.instance_id)}</div><div class="secondary">${escapeHTML(item.branch || item.kind)}</div></td><td>${links}</td><td>${status(stateLabel)}</td><td><div class="actions"><button class="primary-action" data-action="start" data-id="${escapeHTML(item.instance_id)}" ${allowed.has('start') ? '' : 'disabled'}>启动</button><button data-action="stop" data-id="${escapeHTML(item.instance_id)}" ${allowed.has('stop') ? '' : 'disabled'}>停止</button>${restartAPI}${restartBundle}${forceStop}</div></td></tr>`;
        }).join('')}</tbody></table></div>` : '<div class="empty">没有可管理的实例</div>';
        target.querySelectorAll('button[data-action]').forEach(button => button.addEventListener('click', () => runAction(button)));
      } catch (error) {
        target.innerHTML = `<div class="error">${escapeHTML(error.message)}</div>`;
      }
    }
    async function runAction(button) {
      if (button.dataset.confirm && !window.confirm(button.dataset.confirm)) return;
      button.disabled = true;
      try {
        const value = await jsonRequest(`/admin/api/server-instances/${encodeURIComponent(button.dataset.id)}/actions`, {
          method: 'POST', body: JSON.stringify({action: button.dataset.action}),
        });
        const notice = document.getElementById('action-notice');
        notice.textContent = `操作已提交：${value.action}。进程切换可能需要一些时间，请刷新确认最终状态。`;
        notice.hidden = false;
        window.setTimeout(loadInstances, 1200);
      } catch (error) {
        document.getElementById('instances').insertAdjacentHTML('afterbegin', `<div class="error">${escapeHTML(error.message)}</div>`);
        button.disabled = false;
      }
    }
    function renderJobs() {
      const target = document.getElementById('jobs');
      document.getElementById('job-count').textContent = `${state.jobs.length} 条已加载`;
      target.innerHTML = state.jobs.length ? `<div class="table-wrap"><table><thead><tr><th>任务</th><th>用户</th><th>类型</th><th>部署</th><th>状态</th><th>更新时间</th></tr></thead><tbody>${state.jobs.map(item => `<tr><td><div class="primary">${escapeHTML(item.job_id)}</div><div class="secondary">${escapeHTML(item.run_id)}</div></td><td>${escapeHTML(item.owner)}</td><td>${escapeHTML(item.kind)}</td><td>${escapeHTML(item.deployment_id || '—')}</td><td>${status(item.status)}</td><td>${new Date(Number(item.updated_at) * 1000).toLocaleString()}</td></tr>`).join('')}</tbody></table></div>` : '<div class="empty">当前没有测试任务</div>';
      document.getElementById('job-pager').hidden = !state.nextCursor;
    }
    async function loadJobs({append = false} = {}) {
      const target = document.getElementById('jobs');
      try {
        const query = new URLSearchParams({limit: '25'});
        if (append && state.nextCursor) query.set('cursor', state.nextCursor);
        const value = await jsonRequest(`/admin/api/jobs?${query}`);
        state.jobs = append ? state.jobs.concat(value.jobs || []) : (value.jobs || []);
        state.nextCursor = value.next_cursor || null;
        renderJobs();
      } catch (error) {
        target.innerHTML = `<div class="error">${escapeHTML(error.message)}</div>`;
      }
    }
    document.getElementById('refresh-all').addEventListener('click', () => Promise.all([loadInstances(), loadJobs()]));
    document.getElementById('load-more').addEventListener('click', () => loadJobs({append:true}));
    Promise.all([loadInstances(), loadJobs()]);
  </script>
</body>
</html>
