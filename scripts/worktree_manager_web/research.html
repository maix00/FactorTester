<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>FTClient</title>
  <link rel="stylesheet" href="/research-static/katex/katex.min.css">
  <link rel="stylesheet" href="/research-static/research.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-title">FTClient</div>
        <button id="sidebar-toggle" class="sidebar-toggle" type="button" aria-label="收起侧栏" data-i18n-aria="收起侧栏" title="收起侧栏" data-i18n-title="收起侧栏">
          <span class="symbol" data-symbol="sidebar.left"></span>
        </button>
      </div>
      <div id="sidebar-resize-handle" class="sidebar-resize-handle" role="separator" aria-orientation="vertical" aria-label="调整侧栏宽度" data-i18n-aria="调整侧栏宽度"></div>
      <div class="sidebar-caption" data-i18n="功能入口">功能入口</div>
      <nav id="module-nav" aria-label="功能入口" data-i18n-aria="功能入口"></nav>
      <div id="opened-caption" class="sidebar-caption opened-caption" data-i18n="已打开" hidden>已打开</div>
      <nav id="opened-tabs" class="opened-tabs" aria-label="已打开"></nav>
      <div class="sidebar-spacer"></div>
      <button id="account-button" class="account-button">
        <span class="symbol" data-symbol="person.crop.circle"></span><span id="account-title" data-i18n="设置">设置</span>
      </button>
    </aside>
    <main>
      <header class="topbar">
        <div>
          <div class="eyebrow" id="page-eyebrow">FTClient</div>
          <h1 id="page-title" data-i18n="主页">主页</h1>
        </div>
        <div class="toolbar" id="page-toolbar"></div>
      </header>
      <section id="notice" class="notice" hidden></section>
      <section id="content" class="content" aria-live="polite"></section>
    </main>
  </div>

  <dialog id="login-dialog">
    <form method="dialog" class="dialog-card" id="login-form">
      <button class="dialog-close" type="button" id="close-login" aria-label="关闭" data-i18n-aria="关闭">×</button>
      <div class="dialog-icon" data-symbol="person.crop.circle"></div>
      <h2 data-i18n="登录 FactorTester">登录 FactorTester</h2>
      <p data-i18n="登录后读取研究、任务和个人工作区；服务器管理能力会自动判断">登录后读取研究、任务和个人工作区；服务器管理能力会自动判断</p>
      <label><span data-i18n="用户名">用户名</span><input id="username" autocomplete="username" required></label>
      <label><span data-i18n="密码">密码</span><input id="password" type="password" autocomplete="current-password" required></label>
      <label class="check-row"><input id="keep-login" type="checkbox" checked><span data-i18n="保持登录">保持登录</span></label>
      <button class="primary" type="submit" data-i18n="登录">登录</button>
      <button id="show-register" class="secondary" type="button" data-i18n="注册新账户">注册新账户</button>
      <div id="login-error" class="form-error" hidden></div>
    </form>
    <form class="dialog-card" id="register-form" hidden>
      <button class="dialog-close" type="button" id="close-register" aria-label="关闭">×</button>
      <div class="dialog-icon" data-symbol="person.crop.circle"></div>
      <h2 data-i18n="注册 FactorTester">注册 FactorTester</h2>
      <p data-i18n="创建账户后即可登录并管理自己的任务与研究">创建账户后即可登录并管理自己的任务与研究</p>
      <label><span data-i18n="用户名">用户名</span><input id="register-username" autocomplete="username" required></label>
      <label><span data-i18n="密码">密码</span><input id="register-password" type="password" autocomplete="new-password" required></label>
      <label><span data-i18n="机构（可选）">机构（可选）</span><input id="register-organization" placeholder="default"></label>
      <button class="primary" type="submit" data-i18n="注册并登录">注册并登录</button>
      <button id="show-login" class="secondary" type="button" data-i18n="返回登录">返回登录</button>
      <div id="register-error" class="form-error" hidden></div>
    </form>
  </dialog>

  <dialog id="report-settings-dialog">
    <form method="dialog" class="dialog-card wide" id="report-settings-form">
      <button class="dialog-close" value="cancel" aria-label="关闭" data-i18n-aria="关闭">×</button>
      <h2 data-i18n="研究报告设置">研究报告设置</h2>
      <p data-i18n="远端页面读取 FTClient 已上传的结构化镜像；本地文件不会随报告公开">远端页面读取 FTClient 已上传的结构化镜像；本地文件不会随报告公开</p>
      <div class="settings-list">
        <label class="setting-row"><span><b data-i18n="自动同步">自动同步</b><small data-i18n="本地报告 generation 更新后上传到 7998">本地报告 generation 更新后上传到 7998</small></span><input id="setting-auto-sync" type="checkbox"></label>
        <label class="setting-row"><span><b data-i18n="访问范围">访问范围</b><small data-i18n="私有、指定用户或任何访问者">私有、指定用户或任何访问者</small></span><select id="setting-visibility"><option value="private" data-i18n="仅自己">仅自己</option><option value="authorized" data-i18n="授权用户">授权用户</option><option value="public" data-i18n="公开">公开</option></select></label>
        <label class="setting-row"><span><b data-i18n="本地文件中继">本地文件中继</b><small data-i18n="仅在所有者 FTClient 在线且访问者获授权时可用">仅在所有者 FTClient 在线且访问者获授权时可用</small></span><input id="setting-relay" type="checkbox"></label>
        <label class="setting-row"><span><b data-i18n="未完全覆盖时允许推进">未完全覆盖时允许推进</b><small data-i18n="仍显示缺口，但不以覆盖完整性阻止节点推进">仍显示缺口，但不以覆盖完整性阻止节点推进</small></span><input id="setting-gate" type="checkbox"></label>
      </div>
      <section class="authorized-users">
        <div class="section-heading"><div><h3 data-i18n="授权用户">授权用户</h3><p data-i18n="只填写完整用户名；公开模式不依赖此表">只填写完整用户名；公开模式不依赖此表</p></div><button id="add-authorized-user" type="button" data-i18n="添加">添加</button></div>
        <div id="authorized-user-list"></div>
      </section>
      <button class="primary" type="submit" data-i18n="保存设置">保存设置</button>
      <div id="settings-error" class="form-error" hidden></div>
    </form>
  </dialog>

  <script src="/research-static/katex/katex.min.js"></script>
  <script src="/research-static/core/i18n.js"></script>
  <script src="/research-static/core/icons.js"></script>
  <script src="/research-static/jobs/job-artifact-viewers.js"></script>
  <script src="/research-static/core/shared-ui.js"></script>
  <script src="/research-static/report/rich-text.js"></script>
  <script src="/research-static/report/component-view.js"></script>
  <script src="/research-static/report/report-renderer.js"></script>
  <script src="/research-static/report/report-entry.js"></script>
  <script src="/research-static/jobs/artifacts.js"></script>
  <script src="/research-static/jobs/progress.js"></script>
  <script src="/research-static/jobs/jobs.js"></script>
  <script src="/research-static/research/workspaces.js"></script>
  <script src="/research-static/catalog/factors.js"></script>
  <script src="/research-static/catalog/product-tree.js"></script>
  <script src="/research-static/catalog/products.js"></script>
  <script src="/research-static/catalog/details.js"></script>
  <script src="/research-static/workbench/test-settings.js"></script>
  <script src="/research-static/workbench/test-factors.js"></script>
  <script src="/research-static/workbench/test-templates.js"></script>
  <script src="/research-static/workbench/tests.js"></script>
  <script src="/research-static/profiles.js"></script>
  <script src="/research-static/settings.js"></script>
  <script src="/research-static/manager.js"></script>
  <script src="/research-static/app/navigation.js"></script>
  <script src="/research-static/app/tabs.js"></script>
  <script src="/research-static/app/auth.js"></script>
  <script src="/research-static/research.js"></script>
</body>
</html>
