<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>FTClient</title>
  <link rel="stylesheet" href="/research-static/katex/katex.min.css">
  <link rel="stylesheet" href="/research-static/research.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar-title">FTClient</div>
      <div class="sidebar-caption">功能入口</div>
      <nav id="module-nav" aria-label="功能入口"></nav>
      <div class="sidebar-spacer"></div>
      <button id="account-button" class="account-button">
        <span class="symbol">◉</span><span id="account-title">设置</span>
      </button>
    </aside>
    <main>
      <header class="topbar">
        <div>
          <div class="eyebrow" id="page-eyebrow">FTClient</div>
          <h1 id="page-title">主页</h1>
        </div>
        <div class="toolbar" id="page-toolbar"></div>
      </header>
      <section id="notice" class="notice" hidden></section>
      <section id="content" class="content" aria-live="polite"></section>
    </main>
  </div>

  <dialog id="login-dialog">
    <form method="dialog" class="dialog-card" id="login-form">
      <button class="dialog-close" value="cancel" aria-label="关闭">×</button>
      <div class="dialog-icon">◉</div>
      <h2>登录 FactorTester</h2>
      <p>登录后读取研究、任务和个人工作区；服务器管理能力会自动判断</p>
      <label>用户名<input id="username" autocomplete="username" required></label>
      <label>密码<input id="password" type="password" autocomplete="current-password" required></label>
      <label class="check-row"><input id="keep-login" type="checkbox" checked> 保持登录</label>
      <button class="primary" type="submit">登录</button>
      <div id="login-error" class="form-error" hidden></div>
    </form>
  </dialog>

  <dialog id="report-settings-dialog">
    <form method="dialog" class="dialog-card wide" id="report-settings-form">
      <button class="dialog-close" value="cancel" aria-label="关闭">×</button>
      <h2>研究报告设置</h2>
      <p>远端页面读取 FTClient 已上传的结构化镜像；本地文件不会随报告公开</p>
      <div class="settings-list">
        <label class="setting-row"><span><b>自动同步</b><small>本地报告 generation 更新后上传到 7998</small></span><input id="setting-auto-sync" type="checkbox"></label>
        <label class="setting-row"><span><b>访问范围</b><small>私有、指定用户或任何访问者</small></span><select id="setting-visibility"><option value="private">仅自己</option><option value="authorized">授权用户</option><option value="public">公开</option></select></label>
        <label class="setting-row"><span><b>本地文件中继</b><small>仅在所有者 FTClient 在线且访问者获授权时可用</small></span><input id="setting-relay" type="checkbox"></label>
        <label class="setting-row"><span><b>未完全覆盖时允许推进</b><small>仍显示缺口，但不以覆盖完整性阻止节点推进</small></span><input id="setting-gate" type="checkbox"></label>
      </div>
      <section class="authorized-users">
        <div class="section-heading"><div><h3>授权用户</h3><p>只填写完整用户名；公开模式不依赖此表</p></div><button id="add-authorized-user" type="button">添加</button></div>
        <div id="authorized-user-list"></div>
      </section>
      <button class="primary" type="submit">保存设置</button>
      <div id="settings-error" class="form-error" hidden></div>
    </form>
  </dialog>

  <script src="/research-static/katex/katex.min.js"></script>
  <script src="/research-static/i18n.js"></script>
  <script src="/research-static/job-artifact-viewers.js"></script>
  <script src="/research-static/shared-ui.js"></script>
  <script src="/research-static/rich-text.js"></script>
  <script src="/research-static/report-renderer.js"></script>
  <script src="/research-static/jobs.js"></script>
  <script src="/research-static/research-workspaces.js"></script>
  <script src="/research-static/factors.js"></script>
  <script src="/research-static/products.js"></script>
  <script src="/research-static/test-settings.js"></script>
  <script src="/research-static/test-factors.js"></script>
  <script src="/research-static/test-templates.js"></script>
  <script src="/research-static/tests.js"></script>
  <script src="/research-static/profiles.js"></script>
  <script src="/research-static/settings.js"></script>
  <script src="/research-static/manager.js"></script>
  <script src="/research-static/research.js"></script>
</body>
</html>
