[package]
name = "factortester-nautilus-runtime"
version = "0.1.0"
edition = "2024"
license = "LGPL-3.0-only"

[lib]
name = "_libnautilus"
crate-type = ["cdylib"]

[features]
default = []
extension-module = ["nautilus-pyo3/extension-module"]
arrow = ["nautilus-pyo3/arrow"]
betfair = ["nautilus-pyo3/betfair"]
coinapi = ["nautilus-pyo3/coinapi"]
high-precision = ["nautilus-pyo3/high-precision"]
mimalloc = ["nautilus-pyo3/mimalloc"]
redis = ["nautilus-pyo3/redis"]
postgres = ["nautilus-pyo3/postgres"]
defi = ["nautilus-pyo3/defi"]
hypersync = ["nautilus-pyo3/hypersync"]
tracing-bridge = ["nautilus-pyo3/tracing-bridge"]

[dependencies]
nautilus-pyo3 = { path = "../../vendor/nautilus_trader/crates/pyo3", features = ["embedding"] }
nautilus-backtest = { path = "../../vendor/nautilus_trader/crates/backtest", features = ["python", "streaming"] }
nautilus-model = { path = "../../vendor/nautilus_trader/crates/model" }
nautilus-factor-bridge = { path = "../nautilus_factor_bridge", features = ["nautilus-backtest"] }
pyo3 = { version = "0.30.1", features = ["macros", "extension-module"] }
serde_json = "1"

[patch.crates-io]
arrow = { path = "../../vendor/nautilus_trader/patches/arrow-compat" }
parquet = { path = "../../vendor/nautilus_trader/patches/parquet-compat" }
pyo3-stub-gen = { path = "../../vendor/nautilus_trader/patches/pyo3-stub-gen" }

[profile.dev]
opt-level = 0
debug = false # Improves compile times
debug-assertions = false
overflow-checks = false # test profile keeps these on for catching overflow bugs
strip = "debuginfo" # Improves compile times
lto = false
panic = "unwind"
incremental = true

# Compile third-party deps at opt-level=1 in dev/test profiles. Workspace
# members keep opt-level=0 (fast iteration); deps recompile rarely so the
# small one-off compile cost pays off in faster test/run loops.
[profile.dev.package."*"]
opt-level = 1

