[package]
name = "nautilus-factor-bridge"
version = "0.1.0"
edition = "2024"
license = "BSD-2-Clause"
description = "Independent Rust bridge between Nautilus market events and py-alpha-lib factor execution"

[features]
default = []
nautilus = ["dep:nautilus-core", "dep:nautilus-model", "dep:nautilus-common", "dep:ustr"]
nautilus-backtest = ["nautilus", "dep:nautilus-backtest", "nautilus-backtest/streaming", "dep:nautilus-persistence", "dep:nautilus-execution"]

[dependencies]
alpha-algo = { path = "../../vendor/py-alpha-lib/alpha-algo" }
rayon = "1"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
nautilus-core = { path = "../../vendor/nautilus_trader/crates/core", optional = true }
nautilus-model = { path = "../../vendor/nautilus_trader/crates/model", optional = true }
nautilus-common = { path = "../../vendor/nautilus_trader/crates/common", optional = true }
nautilus-backtest = { path = "../../vendor/nautilus_trader/crates/backtest", optional = true }
nautilus-persistence = { path = "../../vendor/nautilus_trader/crates/persistence", optional = true }
nautilus-execution = { path = "../../vendor/nautilus_trader/crates/execution", optional = true }
ustr = { version = "1", optional = true }


[lib]
name = "nautilus_factor_bridge"
path = "src/lib.rs"

[dev-dependencies]
tempfile = "3"
